- record_type: witness
  id: WIT-0003
  source_id: SRC-0001        # al-Ṭabarī
  shelf_mark: "Köprülü 1041"
  repository:
    name: "Köprülü Library"
    city: "Istanbul"
    country_code: "TR"
  language: ar
  script: Arab
  material: paper
  date_of_production:
    start: 1100
    end: 1200
    precision: century
    confidence: 3
  recension: "principal early witness for the AH 222-225 entries"
  edition_relationship: collated
  notes: |
    One of the manuscripts collated for the de Goeje edition of
    al-Ṭabarī (Leiden, 1879-1901) and used in the more recent Cairo
    edition. The witness tradition of al-Ṭabarī is complex and includes
    fragmentary witnesses across many libraries; WIT-0003 is illustrative
    rather than exhaustive of the manuscript base for AH 223.
  metadata:
    schema_version: "2.0.0-preview"
    record_version: "1.0.0"
    created_at: "2026-06-01T00:00:00Z"
    workflow_state: draft
    editorial_review_required: true
