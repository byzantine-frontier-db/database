name: Validate Records
on:
  pull_request:
    paths:
      - 'records/**'
      - 'schema/**'
      - 'tools/byzfrontier_validate.py'
      - 'tools/byzfrontier_xref.py'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema
      - name: Run schema validation (transition-window, v1 + v2)
        run: |
          python tools/byzfrontier_validate.py \
            --schema schema/byzfrontier_schema_v1.json \
            --schema schema/byzfrontier_schema_v2.json \
            --verbose \
            records/
      - name: Run cross-reference validation
        run: |
          python tools/byzfrontier_xref.py records/
      - name: Summary
        if: always()
        run: |
          echo "Validation complete. See output above for details."
          echo "Failed validation will block merge."