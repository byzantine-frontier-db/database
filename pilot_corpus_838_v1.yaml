  - ENT-PLC-0001
  scholar: Treadgold, W.
  publication: The Byzantine Revival, 780-842 (Stanford, 1988)
  date: 1988
  argument: The 838 campaign was strategically and symbolically devastating but did not produce permanent territorial loss; the siege itself, on Treadgold's reconstruction, was relatively brief (~12 days),
    and Amorium was reoccupied within years. The deeper damage was to Theophilos's prestige.
  confidence: 4
