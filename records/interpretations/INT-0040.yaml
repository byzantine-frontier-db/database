  scholar: Eger, A. Asa
  publication: The Islamic-Byzantine Frontier (London, 2015)
  publication_source_id: SRC-0007
  date: 2015
  argument: In his conclusions Eger argues that the eastern central thughūr (the Ḥalab
    steppe and river) was more densely settled than the western thughūr in the Early
    Islamic period, with strong seventh-century continuity; that the Euphrates corridor
    was only sparsely and evenly settled as way stations and crossings; and that the
    region's relative prosperity owed more to the importance of Ḥalab as chief city
    and to irrigation development by locals, elite and caliphs than to Hārūn's ʿawāṣim
    reapportionment alone.
