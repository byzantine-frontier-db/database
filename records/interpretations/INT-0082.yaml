  date: 2015
  argument: The Umayyad state was not an absolutist 'hydraulic' empire but a dominant
    family within a Muslim minority in a largely Christian Levant. It governed through
    indirect administration, incentives of wealth and prestige, and gradual tribal
    cohesion and sedentarization; lands still occupied by non-Muslims were preserved
    but taxed with the kharāj, and monasteries were integrated into this fiscal system.
