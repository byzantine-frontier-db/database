  publication: The Islamic-Byzantine Frontier (London, 2015), ch. 8, pp. 246-263
  publication_source_id: SRC-0007
  date: 2015
  argument: The Byzantine frontier of the seventh-tenth centuries does not represent
    a 'Dark Age' or decline but an adaptive transformation. Rural, fortified, cave-and-village
    settlement and a shift toward mixed agro-pastoralism were resilient responses
    to environmental constraint and raiding, not symptoms of collapse. Read from a
    subsistence perspective, the frontier is less about military strategy and religious
    war than about environmental and economic resilience.
