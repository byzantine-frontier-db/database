  argument: 'In Shaw''s reading, ''the mountains made the man'': in Rough Cilicia
    the mere presence of a leader (e.g. the satrap Datames) in the highlands rendered
    him a political outlaw in the eyes of the central state. Mountains were localized
    frontiers; to control them one had to become part of them, generating central-state
    anxiety — a pattern strongly evocative of nomadic/settled interaction and similar
    to the Islamic-Byzantine frontier nearly a thousand years later.'
