  argument: M. Whittow notes that Theophilos, like his Abbasid contemporary al-Muʿtaṣim,
    maintained a personal bodyguard (hetaireia) of Khazars or Turks from the Farghana
    valley, and an 'Ethiopian Unit' possibly drawn from East African Zanj canal-workers
    of southern Iraq — illustrating the parallel recruitment of foreign and defector
    troops on both sides of the frontier.
  confidence: 3
  notes: Reported in Eger 2015, p. 291 (fn 45).
