  publication: The Spaces Between the Teeth (2008 dissertation), Appendix 2, s.v. Zibaṭra
  publication_source_id: SRC-0065
  date: 2008
  argument: 'Reconciling Sinclair''s two candidate sites, Eger argues that Sinclair''s first site
    — the double-walled ruins at Doğanşehir — is the Early Islamic thughūr of Zibaṭra on the grounds
    of location and physical description, but that Sinclair erred in his historical attribution:
    the historical evidence Sinclair attached to his second site in fact pertains to this thaghr
    of Zibaṭra. Eger''s own autopsy of the intact double walls at Doğanşehir, their resemblance to
    Ḥadath and Malaṭiya, and al-Balādhurī''s ‘great fortress from Byzantine times’ support identifying
    the Doğanşehir ruins with the frontier fortress.'
  supporting_evidence:
