  date: 1994
  argument: The creation of the ʿawāṣim in the first year of Hārūn al-Rashīd's reign
    was a political move to break up the province of the Umayyad North (Armenia, Azerbaijan,
    the thughūr) and consolidate the frontier into a separate, unified administrative
    province under his personal supervision.
