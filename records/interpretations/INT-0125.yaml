  publication_source_id: SRC-0007
  argument: Eger argues that the frontier is best understood not as a Muslim/Christian
    military borderline but as a landscape of tribal interaction and seasonal transhumance
    ('enclosed nomadism'), in which tribes were heterogeneous (some nomadic, some
    sedentary, most in between) and the line between nomad-as-soldier, transhumant
    tribe-as-army-unit and tribal leader-as-commander was tenuous; the introduction
    of non-Arab soldiers (Khurāsānīs, Turks) reflects central-state attempts to quash
    tribal autonomy.
  supporting_evidence:
  - ATT-0297
  - ATT-0299
  confidence: 4
  notes: Eger 2015, pp. 280-284.
