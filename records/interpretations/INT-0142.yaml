  argument: 'The origins of the Jarājima are disputed in modern scholarship, with
    three principal positions reported by Eger and left unresolved: (a) remnants of
    Persian cavalry who remained in Syria cultivating tax-free plots in exchange for
    service (Zakeri; E. L. Daniel); (b) people of Armenian/Caucasus descent from the
    highlands near Qālīqalā / Theodosiopolis (Kaegi; Keiko); and (c) inhabitants of
    the region of Late-Hittite/Assyrian Gurgum, ancient Marʿash (Alkım).'
