  argument: The Islamic attempt to control the Christian Jarājima (seventh-eighth
    centuries) and the Byzantine attempt to control the Bedouin/peasant mountain groups
    (early eleventh century) occurred in the very same Antiochene mountains — not
    on the Taurus frontier line — and reflect a recurring localized frontier of mountain-and-plain;
    the rebel groups practised a semi-nomadic/semi-settled strategy and were forced
    into upland life to preserve local autonomy.
