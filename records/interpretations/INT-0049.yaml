  publication: '''The Balih Valley, Northern Syria, during the Islamic Period: Remarks
    Concerning the Historical Topography'', Berytus 41 (1993/4)'
  date: 1994
  argument: The dearth of evidence for the Umayyad period in the Balikh (the earliest
    Islamic settlement evidence appearing only from the mid-eighth century) is likely
    a manifestation of the difficulty of identifying the transitional coarseware pottery
    rather than of genuine absence of settlement, since the region is known textually
    from the Umayyad period (e.g. via Ḥiṣn Maslama).
