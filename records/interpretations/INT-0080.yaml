  date: 2015
  argument: From c.700 CE new agricultural estates and hydraulic infrastructure (irrigation,
    milling, transport) developed on the frontier, with marshes as overlooked loci
    of settlement. Canal and river settlements were linearly arranged, evenly spaced,
    and sometimes formed double sites on either bank; sites were chosen for proximity
    to water rather than for strategic location — a 'hydraulic villages' pattern paralleled
    in al-Andalus.
