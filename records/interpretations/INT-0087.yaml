  scholar: Wittfogel, K. (and revisionists incl. Wilkinson & Rayne)
  publication: Oriental Despotism (1957); with Wilkinson & Rayne, 'Hydraulic Landscapes'
  argument: 'Wittfogel''s ''Oriental Despotism'' derived totalitarian empire from
    large-scale state irrigation with forced labour and hierarchical water control.
    Against this, scholars argue the reverse — large empires enabled, but did not
    centrally micromanage, irrigation — with two revisionist models: irrigation wholly
    local/tribal, or state-initiated but locally-maintained works (partially embracing
    Wittfogel).'
  confidence: 3
  notes: Reported and adjudicated by Eger 2015 pp.208-9, who favours the revisionist
    position. No publication_source_id.
