  argument: 'The apparent collapse of settlement from the Late Roman to the Early
    Islamic period in older surveys is largely an artefact of ceramic conflation and
    misdating rather than a real demographic gap: Early Islamic diagnostic wares (brittleware
    cooking pots, the holemouth pot, transitional buffwares) were repeatedly classified
    as Late Roman or as undifferentiated ''Roman/Byzantine'', so Early Islamic settlement
    was systematically under-recognised.'
