  argument: The lack of coins of Maslama, against the many coins of the local governor
    al-ʿAbbās b. Muḥammad (759-72), indicates that the Umayyad-phase site of Ḥiṣn
    Maslama was possibly a self-sufficient agricultural estate (ḍayʿa) that was transformed
    in the early ʿAbbāsid period into an administrative centre and/or market or way
    station/garrison.
