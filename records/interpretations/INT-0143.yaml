  argument: The Jarājima functioned as a self-governing 'political tribe'. Byzantine
    use of them as buffers and allies is typical of Byzantine frontier warfare — keeping
    them within the Islamic frontier rather than raiding Byzantine lands — yet the
    inability of either empire to control them shows them to have been effectively
    self-governing, resembling the local frontier Byzantines who likewise took to
    mountain refuges as an environmental-political response.
