  argument: 'Eger argues that the parts of the frontier reconquered by the Byzantines
    — the western thughūr and the urban centres — fared differently from the renomadised
    interior: Anṭākiya grew in importance under Middle Byzantine rule, Ḥiṣn al-Tīnāt
    shows continuity and tenth-century refortification, and local kilns produced splash-glazed
    sgraffiato and turquoise-glazed wares for the region, indicating sustained investment
    and exchange.'
