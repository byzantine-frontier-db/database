  date: 2015
  argument: The recurring 'imāra ('rebuild') narratives — e.g. the Caliph al-Mahdī
    and then Hārūn al-Rashīd ordering Tarsus rebuilt 'from ruins' — function as legitimising
    devices that construct a mythic wilderness for a rising power and deny earlier
    Umayyad-era Islamic claims to those settlements. Eger follows Kopytoff's model
    in which defining the frontier as 'empty' is a political act made from the intruders'
    perspective.
  confidence: 3
  notes: Eger 2015, Introduction, pp. 8-9 (and nn. 22-23). al-Mahdī and Hārūn al-Rashīd
