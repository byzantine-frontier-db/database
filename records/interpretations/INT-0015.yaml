  publication_source_id: SRC-0007
  date: 2015
  argument: Excavations at major frontier settlements — Tarsus, Antakiya (Antioch)
    and Sumaysat — show no dramatic seventh-century destruction, ruin or burning,
    which Eger takes as support for reading the wilderness / scorched-earth accounts
    as literary topoi rather than eyewitness testimony. He stresses the verb sha'atha
    (used of Heraklios) implies unsettling or scattering rather than physical destruction,
    and that deliberate burning of forts would have left archaeological traces and
    demanded excessive labour from a retreating power.
