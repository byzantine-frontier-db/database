  argument: Eger argues that the ḥimā — a protected tribal pasture with a military
    aspect, known since pre-Islamic Arabia — was an institution of frontier interaction
    that combined a military function (breeding mounts) with an environmental and
    economic logic of sustainability, preventing desertification and overgrazing and
    preserving grazing land in dry years; al-Andalus (post-reconquista militarily
    protected sheep-routes) provides a comparative parallel showing this was an environmental-economic
    strategy, not merely a Near Eastern peculiarity.
  confidence: 3
  notes: Eger 2015, pp. 285-287. al-Rabaḍa (the ḥimā of 'Umar, 637) and al-Andalus
    referenced but not minted.
