  scholar: Eger, A. A.
  publication: 'The Islamic-Byzantine Frontier: Interaction and Exchange (London:
    I.B. Tauris, 2015)'
  publication_source_id: SRC-0007
  date: 2015
  argument: 'Eger holds that the administrative division of the frontier into a forward
    thughūr zone and a rear ʿawāṣim province only emerges from the end of the eighth
    century and did not remain static. He reports an unresolved scholarly disagreement
    over its character: Shaban sees the ʿawāṣim as a tighter, closer defence system;
    Bonner reads it as an idealised, political-administrative move by the ʿAbbāsids
    to assert authority over former Umayyad lands and curb local power; Abu Ezzah
    regards the division as arbitrary and inconsistent, the town-lists varying from
    author to author, with little effect on everyday frontier life.'
  confidence: 3
  notes: Eger 2015, Introduction, pp. 18-19 (and nn. 47-48). Scholarly conflict preserved
    rather than resolved (editorial rule 1). Per the workflow's secondary-source rule,
    a full treatment would record Shaban, Bonner and Abu Ezzah each as Interpretation
    records against their own works; those secondary sources are not yet in the corpus,
    so they are DEFERRED and only Eger's synthesis/representation is captured here.
