  publication_source_id: SRC-0007
  date: 2015
  argument: Caliphal canal-building (notably by Maslama and Hishām) was entrepreneurial,
    channelling provincial wealth toward the state, but central-state initiative must
    not be assumed to be general practice. Even the Syriac authors stress that no
    caliph before Hishām undertook such works; the diwān al-ḍiyāʿ and diwān al-mawārith
    imply that by the ninth century other landowners ran estates; and caliphal irrigation
    initiative diminished sharply after al-Manṣūr and al-Mahdī at the end of the eighth
    century.
