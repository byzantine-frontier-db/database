  argument: Frontier canal systems were conservative and localised in scale — none
    approached the 230-km Sasanian Nahrawān Canal, and even the largest thughūr/Jazīra
    systems (Nahr Dawrīn, the Khabūr zone) irrigated only c. 30,000 ha — so construction,
    maintenance and organisation operated at the scale of a town or the collective
    authority of several hydraulic villages, even where the central administration
    retained an interest.
