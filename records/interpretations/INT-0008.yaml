  argument: The lowland-to-upland settlement shift (the Anatolian analogue of incastellamento)
    was gradual and should not be keyed to specific historical events such as the
    mid-seventh-century conquests; the chronology should be 'lengthened and unbound',
    with removal to the uplands beginning in the Early Islamic period and perhaps
    earlier.
