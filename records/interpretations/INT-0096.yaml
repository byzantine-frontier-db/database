  date: 2009
  argument: Nearly all the relevant species were cultivated before the Islamic conquest,
    and water technologies and summer agrarian calendars were already present; any
    'revolution' was a gradual, diffused intensification of existing land-reclamation,
    settlement and irrigation strategies rather than an innovation in methods or materials.
