  publication_source_id: SRC-0007
  date: 2015
  argument: 'Eger explains the Late Roman shift to upland settlement in the Amuq as
    a dynamic response to the growth of the lake and marshes: a feedback cycle in
    which marsh-avoidance and the pressures of the olive-oil export market drove dispersed
    upland settlement, deforestation and cultivation, loosening topsoils that eroded
    onto the plain, silting canals and rivers and causing marshification, which in
    turn prompted further upland retreat and intensified oil and wine production.'
