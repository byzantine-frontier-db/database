  scholar: Lindner, R. P.
  publication: 'Nomads and Ottomans in Medieval Anatolia (Bloomington, IN, 1983),
    pp. 11, 40; with K. Y. Blankinship, The End of the Jihād State (Albany: SUNY Press,
    1994), pp. 78-9'
  date: 1983
  argument: 'R. P. Lindner argues against Wittek''s ghazī thesis: the formative Turkish/Ottoman
    tribe was syncretic rather than purely Muslim and did not initially aim to convert
    Christians; the ghazī image was a retroactive construction by the educated, orthodox,
    sedentary classes who entered the administration, ''converting the nomadic pragmatist
    to a clever Holy Warrior''. Just as the jihād was invoked to justify early Bedouin
    operations, the ghaza justified Ottoman predation. Blankinship extends a comparable
    economic-predation reading to the Umayyads, for whom the jihād policy kept troops
    employed and discontented elements dispersed.'
  confidence: 4
  notes: 'Reported in Eger 2015, pp. 292-293 (fn 48). DISPUTE: directly opposes Wittek''s
    ghazī thesis (INT-0138). The two interpretations contradict one another on whether
    early Ottoman state-formation was driven by genuine religious holy-war (Wittek)
    or by economic predation later reframed as holy war (Lindner); Eger endorses Lindner.'
