  argument: Caliphal/state investment in water-mills (ʿurūb, e.g. around Mawṣil from
    the Marwanid period, and mills ascribed to Hishām) and in irrigation was both
    a revenue source and a means of inducing frontier inhabitants to settle and channel
    loyalty to the central state, thereby extending its control.
