  date: 2008
  argument: Eger argues that Sanjah and Bahasnā were likely one settlement, or two proximal
    ones — the earlier lower town (Sanjah) and the later upland castle (Bahasnā) — and that,
    since neither name appears in the Early Islamic thughūr lists but only from the mid-tenth
    century, the place is best read as a settlement that shifted into an upland fortification
    by the thirteenth century.
