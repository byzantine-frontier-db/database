  argument: Eger argues that frontier tribes functioned as political rather than strictly
    genealogical units, incorporating defectors, prisoners, runaways and mawālī; that
    'aṣabiya (ancestral solidarity) was a deliberately vague, mythic binding ideology
    best mobilised when framed within religious ideology (jihād); and that cross-frontier
    identity was genuinely two-way, with Muslims helping Byzantine Christians (mustaʿriba)
    and Christians and others entering Islamic service, so that the frontier unit
    resembled a politically ordered group or army garrison more than a closed lineage.
