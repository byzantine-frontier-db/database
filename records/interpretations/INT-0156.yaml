  publication: 'Eger, A. Asa, The Islamic-Byzantine Frontier: Interaction and Exchange
    (London: I.B. Tauris, 2015), Conclusions (pp. 310-314)'
  publication_source_id: SRC-0007
  date: 2015
  argument: 'Jihād and apocalypse together constituted an ideological ''third layer''
    articulated by Islamic (and, mutatis mutandis, Byzantine) authors: a literary-religious
    construction — eschatological tales, military-campaign books, epic poems, orations,
    and fantastical geographies — that functioned as propaganda from the central lands.
    It instructed how to administer the periphery, attracted settlers, built up the
    regional economy, justified raiding, and internally galvanised mixed frontier
    societies against an antagonistic external ''other'', dividing the world into
    dār al-Islām and dār al-ḥarb.'
  confidence: 4
  notes: 'Major synthesis of the book''s ideological-frontier argument. Eger adduces
    as exemplars: Kitāb al-Siyar (SRC-0061), Digenes Akritas (SRC-0062), and al-Mutanabbī''s
    Ḥadath qaṣīda (SRC-0064; attested ATT-0337), plus eschatological/apocalyptic tales
    and fantastical geographies. Modern scholarship Eger leans on but not minted as
    separate INTs this session: Madelung, ''Apocalyptic Prophecies in Ḥimṣ'' (1986);
    al-Zaid, ''The Apocalyptic Frontier'' (2004) — deferred. Stands in dialectical
    tension with INT-0153/1732; resolved at INT-0158.'
