  scholar: Eger, A. Asa
  publication: The Islamic-Byzantine Frontier (I.B. Tauris, 2015)
  publication_source_id: SRC-0007
  date: 2015
  argument: 'Eger argues that the Islamic-Byzantine frontier underwent a long settlement
    transformation morphologically and chronologically analogous to western Mediterranean
    incastellamento (the concept introduced by Toubert and developed by Guichard):
    a villa-to-village shift from dispersed, largely unfortified lowland farms and
    towns toward nucleated, defensible fortified upland villages and castles, gradual
    from the Late Hellenistic to the end of the Early Islamic period and rapid in
    the Middle Islamic period.'
  confidence: 3
  notes: Eger's central Part 2 framework claim; Toubert and Guichard credited as the
    originators of the incastellamento concept.
