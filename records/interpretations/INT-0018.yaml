  date: 2015
  argument: 'Eger argues the frontier was layered and constituted three types of interaction:
    external (competition for resources between groups), internal (political relationships
    between the central state and peripheral groups), and ideological (military and
    religious conflict) — with movement and communication consisting primarily of
    upland-lowland interactions duplicated across many localised ecological ''niches''
    rather than confined to a single monumental frontier.'
