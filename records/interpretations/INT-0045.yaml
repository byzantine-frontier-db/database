  publication: '"Die Umgebung des Lidar Höyük", in Continuity and Change'
  date: 1994
  argument: In the sixth century settlement expanded onto the hilly land between Ruhā
    and the Euphrates as Byzantines sought refuge from the demands of Sasanian armies
    and Bedouin in the plains; seventh- and eighth-century settlement around Lidar
    may be connected to a Byzantine evacuation of the area after the Islamic conquest,
    with historical accounts of the Byzantines resettling the Syrian population into
    Thrace.
