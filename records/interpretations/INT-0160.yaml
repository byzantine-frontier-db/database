  argument: 'In a final move, the frontier is ''deconstructed'': no longer a means
    to an end, it becomes a tool and discursive framework for addressing problems
    across disciplines. Perceptions of frontiers are a product of the disciplines
    that created them; examining the thughūr reveals how archaeology, history, art
    history, and literature each place their own frontiers. The deconstruction is
    itself generative — an ''epistemological imāra'' (rebuilding/repopulation).'
  confidence: 3
