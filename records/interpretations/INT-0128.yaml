  argument: Eger argues that markets and fairs created an interdependent, largely
    self-sufficient frontier economy linking transhumant tribes, settled communities
    and foreign traders; fairs were frequently held on neutral ground at or outside
    towns, often at Christian saints' shrines on fixed feast-days, allowing settlers,
    pastoralists and foreigners to trade without entering the town, and the settlement
    of thughūr towns in open lowland on main routes (rather than in defensible strongholds)
    reflects this openness to trade.
