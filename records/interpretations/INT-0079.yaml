  date: 2015
  argument: 'In the Early Islamic thughūr the number of surveyed sites was about half
    the Late Roman figure, but this reflects neither smooth continuity nor a ''no
    man''s land''. Four interlocking processes shaped settlement from the seventh
    to tenth centuries: persistence of Late Roman patterns; new canal/river agricultural
    estates; environmental adaptation to growing marshlands; and, by the eighth century,
    increased activity, sedentarization and a system of way stations. Together these
    reveal gradual accommodation and adaptation among frontier groups, an alternative
    to the standard Muslim-Christian conflict narrative.'
