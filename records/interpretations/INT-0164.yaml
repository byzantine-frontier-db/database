  publication_source_id: SRC-0065
  date: 2008
  argument: Eger reads Adhana's two documented settlement loci — the west-bank Tepebağ
    hill and the east-bank riverine quarter — as corresponding either to two distinct
    Early Islamic encampments (a Syrian and a Khurāsānī) or to a fortress-and-town
    pairing, following the historical evidence for successive Umayyad and ʿAbbāsid
    foundations on both banks of the Sayhān.
  supporting_evidence:
