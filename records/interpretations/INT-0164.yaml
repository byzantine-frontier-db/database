  - ATT-0340
  - ATT-0341
  confidence: 3
  notes: Eger's own identification (Section-2/Section-4 synthesis), attributed to him
    against SRC-0065 rather than asserted as fact. Rests on the fortification history
    (ATT-0339, ATT-0340) and his 2005 site autopsy (ATT-0341); supporting_evidence
    is attestation-only per the INT evidence rule. The Syrian-vs-Khurāsānī split is
    the more specific of the two readings Eger offers and remains a hypothesis.
