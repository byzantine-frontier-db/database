  argument: 'Drawing on Iberian and Italian research (Glick; Barrionuevo and López;
    de Meulemeester and Matthys), Eger reports a comparative model of incastellamento
    for al-Andalus: a transition from dispersed, tribally-based alquería hydraulic
    sites to nucleated village groupings around a fortification (the ḥiṣn/qarya model)
    from the end of the tenth century. The earliest ḥuṣūn comprised a central residence,
    a celoquia (sālaqiya) for the qāʾid, and a cistern with a walled enclosure (baqar/albacar)
    for sheltering livestock and people; some served as fortified granaries, a role
    de Meulemeester likens to the storage function of contemporary churches. The density
    of these fortifications in the populous southern plains, rather than along the
    Christian border, shows they were for refuge rather than a military borderline.'
  confidence: 3
