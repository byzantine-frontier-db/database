  argument: 'Upland/lowland, central-state/periphery interaction is neither unique
    to the Islamic-Byzantine frontier nor to a single period: comparable processes
    recur across regions (Eger draws on Scott''s ''art of not being governed'' and
    comparative scholarship on upland Southeast Asia, west China and the Vietnam-India
    borderlands). The inhabitants of localized frontiers are not fixed but shift with
    historical circumstance — local Byzantines becoming mountain pastoralists, the
    Hispano-Roman population of al-Andalus, the Cilicians, the Jarājima retreating
    to the Amanus — down to modern analogues such as the Kurds/PKK in the Amanus and
    ETA in the Pyrenees.'
