  argument: The 'fortified square enclosure' is a distinct Early Islamic mid-range
    settlement type — way stations between the thughūr towns and rural farms — retaining
    the qaṣr layout; because several may be misidentified Roman forts (e.g. Tell Brak),
    they should prompt a revision of received notions of the Roman limes. Hisn al-Tīnāt
    shows that by the tenth century such a site could be a coastal trade settlement
    rather than an isolated garrison.
