  argument: 'Adapting Butzer''s tripartite scale model to the thughūr: a MACRO scale
    of state projects on major rivers (Euphrates, Balikh, Khabūr canals) with caliphal
    ṣawāfī and estates (Hishām on the Euphrates); a MESO scale run by the collective
    authority of multiple villages or estates (the Amuq ʿAfrīn and ʿImm canals, the
    Marʿash Plain, Balis/Dibsi Faraj); and a MICRO scale of communities beyond the
    central state — chiefly the Christian groups of the Syrian Jibāl — digging their
    own systems, ''invisible'' to the textual record.'
