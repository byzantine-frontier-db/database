  publication: 'The Islamic-Byzantine Frontier (London: I.B. Tauris, 2015), ch. 9'
  publication_source_id: SRC-0007
  date: 2015
  argument: 'Eger argues that the system of ḥuṣūn (fortified upland towns and castles)
    of the tenth to thirteenth centuries inverted the feudal model: these settlements
    did not follow a military borderline, nor function as feudal centres of urban
    power, tax collection and control over a rural population. Instead they were non-linear,
    defensive complexes that sheltered local populations, stored grain, and held livestock
    — self-sufficient products of frontier incastellamento that belong in an entirely
    different class from castles of the Western European/Christian medieval model.'
