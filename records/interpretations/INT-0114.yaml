  date: 2015
  argument: 'A four-period model of frontier history: (1) 632-c.700, wide conquests
    under Sufyanid policy with expanded Jazira/Ḥalab settlement; (2) c.700-c.750,
    Marwanid irrigation and estate-building in the Jazira and North Syria; (3) c.750-809,
    full early-Abbasid development with direct caliphal involvement; (4) 809-c.900,
    post-civil-war frontier autonomy with minimal caliphal presence, extending into
    the tenth century under Hamdanid rule and Byzantine reconquest.'
