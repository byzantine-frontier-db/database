  publication: The Islamic-Byzantine Frontier (I.B. Tauris, 2015)
  publication_source_id: SRC-0007
  date: 2015
  argument: The Balikh, the Middle Euphrates/Khabūr confluence and the western/central
    Khabūr were unusual micro-regions, showing roughly twice (or more) the typical
    proportion of Early Islamic to Late Roman sites — scanty post-conquest occupation
    followed by rapid early Abbasid settlement growth, much of it canal-irrigated.
    This archaeological pattern complicates and challenges the view that Jaziran Muslim
    settlement was driven by opportunism and desperation rather than elite enthusiasm.
