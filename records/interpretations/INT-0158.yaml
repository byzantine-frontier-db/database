  date: 2015
  argument: 'Central thesis: the thughūr was none of the simple definitions (not a
    single physical space, not merely a population, not merely competing communities).
    It is the simultaneous accumulation of several layers of perception — one a clearly-defined
    historical frontier actively imbued with purpose by its inhabitants, another an
    archaeological landscape passively transformed by changing environmental conditions.
    The thughūr is best redefined as a framework within which processes of interaction,
    exchange, and competition (between groups, and between groups and their environment)
    unfold diachronically across these layers.'
  confidence: 4
  notes: 'The book''s culminating multi-layer / processes-of-interaction model — the
    synthesis toward which the whole work builds. This interpretation resolves the
    deliberate dialectic between INT-0153/1732 (archaeological continuity, frontier
    imperceptible) and INT-0156 (ideological/imagined frontier) by holding both as
    co-present ''layers''. INT-to-INT relations recorded here in notes only, per rule
