  scholar: Eger, A. Asa
  publication: The Islamic-Byzantine Frontier (2015), ch. 9
  publication_source_id: SRC-0007
  date: 2015
  argument: 'Eger argues for a ''century of discontinuity'' and renomadization in
    the tenth-eleventh centuries: marked site abandonment, a shift from farmsteads
    to fortresses and from villa to village, and a transformation of the settled landscape
    into a transient landscape of camps. He links this to political and economic fragmentation,
    the weakening of ties to Baghdad after the capital moved to Samarra'', an influx
    of Turkic and Arabian tribes, and environmental degradation (aggradation, marshification
    and the collapse of unmaintained canal systems). Middle Islamic/Middle Byzantine
    settlement falls into two phases and shows nucleated dispersal, consolidation
    around tells, and the fortification of tells and uplands.'
