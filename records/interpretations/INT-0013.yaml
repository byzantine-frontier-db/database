  publication_source_id: SRC-0007
  date: 2015
  argument: The depiction of the frontier as an empty 'no man's land' built up by
    the Arabs after Heraklios' scorched-earth retreat is not confirmed by archaeological
    evidence; it served the ideological needs of those who advanced it. Eger argues
    there are two superimposed frontiers — an imagined military/religious one and
    a real ecological one of settlement and interaction — each grounded in its own
    category of evidence, and the volume's purpose is to juxtapose them.
