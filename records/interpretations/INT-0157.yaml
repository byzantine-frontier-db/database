  argument: 'Jihād was an elastic, idiosyncratic concept rather than a static, monumental
    one: its development tracked the changing political and social realities of relations
    with non-Muslim individuals, communities, and empires. Jihād and apocalypse were
    structurally similar narratives in that their mythology could be re-fitted to
    any actual event of war — victory, defeat, or political crisis alike.'
