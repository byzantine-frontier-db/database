  argument: The eastern thughūr was more sparsely settled, with small rural settlements,
    than the central thughūr around Ḥalab, and more similar to the Amuq and Kahramanmaraş
    plains; settlement was reduced by about half from the Late Roman period. The Euphrates
    served only as a crossing for land routes rather than as a settlement axis, and
    sites clustered around springs and spring-fed streams in a largely rain-fed agricultural
    zone, with far fewer canal projects than further south.
