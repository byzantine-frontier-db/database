  publication: Work on al-Andalus irrigation (cited by Eger 2015, pp. 216-217)
  date: 1988
  argument: 'In al-Andalus, irrigation organised on a tripartite scale: a macro (Roman,
    50-100 km²), a meso (a small group of typically seven villages, 15-125 ha) and
    a micro (c. 1 ha) scale; Islamic-period water rights were adapted from the Roman
    ''Syrian System'', and meso/micro scales correlated with tribal/segmentary rather
    than feudal Visigothic organisation.'
  confidence: 3
