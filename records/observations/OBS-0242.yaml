  proposition: At the Bozlar site in the Gölbaşı valley a massive limestone-ashlar
    city wall with a rubble-and-mortar core and square buttresses survives to a length
    of about 50 m, guarding the entrance to the Darb al-Ḥadath pass; surface pottery
    spans Roman to Early Islamic.
