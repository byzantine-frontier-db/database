  id: OBS-0238
  proposition: The standing architecture at ʿAyn Zarba is predominantly Roman/Late
    Roman–Byzantine; two tile baths survive exceptionally well amid deep sedimentation
    and may have been reused (e.g. as pottery kilns), while the monumental arch is
    severely degraded and inscribed stones have been robbed for house-building.
