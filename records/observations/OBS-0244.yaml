  id: OBS-0244
  proposition: Surface inspection of the town-centre tell at Adıyaman yielded no diagnostically
    Early Islamic material and very little of any period; Ḥiṣn Manṣūr is thus an example of
    an Early Islamic frontier foundation established beside, rather than on, the classical
    city (Perre), sited to command trade routes rather than a pass.
