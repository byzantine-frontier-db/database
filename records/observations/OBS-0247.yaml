- record_type: observation
  id: OBS-0247
  proposition: Eger's own examination of the 2004 Mopsus Survey ceramics from Mutallip Höyük
    yielded Early Islamic wares alongside Roman, Late Roman and Middle Islamic material, and
    he found the mound's prominent height atypical of Early Islamic frontier forts — data
    that bear on, and partly complicate, the identification of al-Muthaqqab with this tell.
  associated_entities:
