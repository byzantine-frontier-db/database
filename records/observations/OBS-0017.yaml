- record_type: observation
  id: OBS-0017
  proposition: Ibn Khurradādhbih preserves an eyewitness description, attributed to
    the astronomer Muḥammad ibn Mūsā (sent by al-Wāthiq, r. 842-847, to locate the
    Cave of the Seven Sleepers), of a rock-cut Cappadocian cave settlement at Qurra
    in the rural district (rustāq) of Kharama.
  associated_entities:
  - ENT-PLC-0013
  supporting_attestations:
  - ATT-0055
  notes: The long indented quotation in Eger (pp. 254-5) is paraphrased here for copyright;
    English rendering via Zadeh, Mapping Frontiers Across Medieval Islam, pp. 35-7.
    The specific site Qurra/Kharama is not separately minted; whether it is the same
    Qurra (Greek Koron) as the Cappadocian campaign headquarters named at the chapter's
    opening is uncertain and flagged.
