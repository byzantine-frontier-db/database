  id: OBS-0104
  proposition: Tell Mahrē (Tell Sheikh Hassan, BS 142, possibly Greek Therimachon)
    was a 20-ha walled town (450 x 450 m) on the Raqqa-Ḥarrān road, with a central
    mound, church and small mosque, succeeding a smaller c. 7-ha Late Roman site;
    it is listed by Ibn Khurradādhbih as a road-stop and called a fortified town by
    Yāqūt.
