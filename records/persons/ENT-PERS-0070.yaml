  analytical_summary: Commander of the Muḥammira, a body of Kurdish and Persian defectors
    that joined the emperor Theophilos during his 837 attack on Zibaṭra and Malaṭiya.
    Named variously in the Arabic tradition (Narsī / Narseh / Naṣīr / Nuṣayr) and
    under the Greek name Theophobos. The defectors were enlisted as regularly paid
    Byzantine troops and given wives.
  linked_attestations:
