  analytical_summary: Leader of the Paulicians, eastern dualist Christians who held
    the mountainous terrain north of Malaṭiya towards Tephrike; described as a mawlā
    of Ṭāhir b. al-Ḥusayn. The Paulicians under his control sided with the Muslims
    against the Byzantines and were eventually defeated by the Byzantines in 872.
