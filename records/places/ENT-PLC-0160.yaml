  standardised_name: Çadır Höyük
  place_type: fortification
  identification_status: identified
  identification_confidence: 4
  overall_confidence: 4
  analytical_summary: A fortified tell in northern (central) Anatolia, occupied in
    the ninth and tenth centuries. Excavations revealed that the fortification wall
    around the summit was intended to protect a storage area and a stable of livestock
    for a population living on a lower terrace — an Anatolian parallel to the refuge-and-storage
    function Eger identifies in the frontier ḥuṣūn.
