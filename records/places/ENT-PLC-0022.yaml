  frontier_role: Principal city of the western rift valley; former metropolis whose
    hinterland was the Amuq Plain; by the Early Islamic period a reduced but functioning
    frontier town with its port at al-Mina'.
  overall_confidence: 5
  analytical_summary: Greatly reduced from its Late Roman extent by the Early Islamic
    period, but Eger argues the contraction predates Islam (wall reduced already under
    Justinian) and that the city transitioned with little disruption rather than catastrophic
    collapse. Population mixed (Syriac, Melkite, Georgian, Armenian Christians; Persian,
    Zuṭṭ, Syrian-Arab Muslims). Notable ceramic industries (Syrian yellow glaze, turquoise,
    export-only Champlevé). [Ch. 1, pp. 64-66.]
