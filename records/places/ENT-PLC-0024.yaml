  analytical_summary: Identified with survey site AS 345; a third-century town on
    the Anṭākiya-Qinnasrīn road (Peutinger Table). Attested in Late Antiquity by Theodoret
    and a sixth-century Greek inscription (Imminoi); described in 1051 by Ibn Buṭlān
    (via Yāqūt) as a Christian town with springs, four churches, one mosque and mills;
    still predominantly Christian and fortified (Ḥiṣn ʿImm) by 1280. One of two Christian/Muslim
    villages Eger uses as a case study. [Ch. 1, pp. 51-53.]
