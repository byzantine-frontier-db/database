  environmental_setting: A straightened channel running parallel down the east side
    of the Balikh Valley from its top, irrigating large areas; the dominant canal
    of the sixth- to eighth-century Balikh landscape. After diverting water from the
    river it re-emptied into it just south of Tell Hammam et-Turkmān; sites were conspicuously
    aligned along it.
  overall_confidence: 3
  analytical_summary: The principal Balikh irrigation canal (Nahr al-Abbāra / Nahr
    Turkmān), documented by Wilkinson's Western Jazira Archaeological Landscape Project.
    It replaced an earlier, smaller Sahlān-Ḥammām canal system (Hellenistic to sixth
    century). Eger reports the identification of this canal with one built by Hishām
    as caliph in 724 — an interpretation recorded separately (see PROV-INT records)
    and resting on the Agapius/Chronicle-of-819/Jarīr testimony.
