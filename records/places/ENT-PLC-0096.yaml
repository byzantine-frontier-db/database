  environmental_setting: Broad lowland c. 400 m.a.s.l. bordered east by the Tektek
    Mountains and west by low hills; sloping north (470 m) to south (345 m); 300-400
    mm/annum rainfall, fertile, watered by the Jullab River and susceptible to flooding.
    Forms one topographic unit with the Balikh valley. Wheat, lentils, chickpeas,
    fruit and vegetables cultivated.
  overall_confidence: 5
  analytical_summary: The Harran Plain (Urfa-Harran Basin) is the northern, better-watered
    half of the Balikh topographic unit, with the Balikh's springs rising within it.
    In the Late Roman period its focal urban centres were Edessa (Ruhā) and Karrhai
    (Ḥarrān); these were succeeded by Balikh-valley settlement in the Early Islamic
    period.
