  analytical_summary: Bājadda / Baghadda (survey site BS 172, modern Khirbat al-Anbār),
    a Balikh-valley settlement attributed as a Maslama foundation. al-Sarakhsī (late
    ninth century) describes it as a walled city with gardens and a central well irrigating
    the fields; Yāqūt states that Maslama b. ʿAbd al-Malik granted the land as a fief
    (iqṭāʿ / qaṭīʿa) to one of his captains, Āsīd of the Sulaym, who walled and built
    up the village.
