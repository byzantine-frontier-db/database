  analytical_summary: Third micro-region of the eastern thughūr, called thughūr al-bakriya
    (the northern frontier of Diyār Bakr). Its forts — Hisn Qalawdhiya, Hisn Ziyad,
    Hisn Kamkh and Shimshāṭ — are identified by Eger with the "region of the fortresses"
    (al-ḥuṣūn) of the Life of Theodota of Amida.
