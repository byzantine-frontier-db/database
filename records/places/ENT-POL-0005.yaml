  frontier_role: The first caliphate, under which the early Islamic conquests brought
    Syria, the Jazīra, and the future Thughūr–ʿAwāṣim frontier zone under Muslim control;
    formative rather than administrative in the frontier's later sense.
  analytical_summary: The Rāshidūn ("Rightly-Guided") Caliphate, 632–661 CE — from the
    succession of Abū Bakr after the death of the Prophet to the end of the caliphate
    of ʿAlī ibn Abī Ṭālib. Its caliphs were Abū Bakr, ʿUmar ibn al-Khaṭṭāb, ʿUthmān
    ibn ʿAffān, and ʿAlī. The conquest-era polity to which the corpus's early commanders
    (Abū ʿUbayda, Iyāḍ ibn Ghanm, Ḥabīb ibn Maslama) and events (the north-Syrian and
    Jaziran conquests, Ṣiffīn) belong. Predecessor to the Umayyad Caliphate (ENT-POL-0003).
