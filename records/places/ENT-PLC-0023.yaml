    site near presumed Germanikeia). Rebuilt three times in the Umayyad period (Muʿāwiya,
    al-ʿAbbās b. al-Walīd I, Marwān II) and later by Hārūn al-Rashīd; possibly Emperor
    Leo III's hometown. [Ch. 1, pp. 66-67.]
