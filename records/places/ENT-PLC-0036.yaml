  analytical_summary: Excavated Euphrates settlement c. 17 km south-east of Balis,
    on a plateau overlooking the river, at the southernmost edge of the thughūr/ʿawāṣim
    territory. Identified with Early Islamic Qasirīn (Greek Athis/Neocaesareia/Kaiserion).
    Excavations (1971-4) revealed an L-shaped residence built over the citadel basilica
    in the Early Islamic period and occupation continuing, with interruptions, into
    the thirteenth century.
