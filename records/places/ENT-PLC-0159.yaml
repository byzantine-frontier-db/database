  analytical_summary: A tell on the Upper Euphrates where a Middle Islamic fortified
    building occupied much of the mound, with a 1.5 m-thick wall following the tell's
    contour line, interspersed with buttresses and watchtowers. A second phase shows
    subdivided rooms and animal skeletons, indicating that the fortified settlement
    also enclosed space for livestock — reminiscent of incastellamento practices at
    earlier Byzantine upland sites with open courtyards for sheltering villagers'
    livestock in times of trouble.
