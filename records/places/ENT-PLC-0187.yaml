  analytical_summary: A fortress of the thughūr al-shāmiyya named by Ibn Ḥawqal and placed
    by Yāqūt two days from Ṭarsūs, in a mountain pass overlooking the city some eight farsakhs
    (c. 65 km) away; unidentified today, tentatively located by Eger near Bughaz or Pozantı
    by the Cilician Gates. The entry preserves an unusually detailed garrison roster (qāḍī,
    amir and deputy, preacher, fort- and bath-keepers, clerk, couriers, trumpeter and troops,
    with a bathhouse and a bar on women and unbearded boys), valued as a snapshot of a typical
    frontier garrison. Minted in Phase 2 Session 3 from SRC-0065 after NFKD-normalized matching
    returned no existing entity.
