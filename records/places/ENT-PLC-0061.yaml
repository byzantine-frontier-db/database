  analytical_summary: Lowland river-valley town (Greek Araban) at the confluence of
    a Euphrates tributary (the Kara Su); a flat-topped tell (Altıntaş Kalesi) with
    an encircling lower city. Yāqūt mentions a fortress under a hill (qalʿa taḥt jabal).
    Taken during the early Islamic conquests by Abū ʿUbayda; later an ʿawāṣim town
    and a node on the Euphrates route.
