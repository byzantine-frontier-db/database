  analytical_summary: Town outpost (Greek Adata) guarding a key Taurus pass; a Late
    Roman settlement refounded/refortified under al-Mahdī (or his son Hārūn) in the
    late eighth century. Its sun-dried-brick (libin) walls were repaired after "melting"
    in winter rains and a mosque was built; ashlar-mortared walls with square buttresses
    are of uncertain date. A Byzantine raid in 785/6 drove off market traders; a Christian
    community and bishopric are attested in the ninth century.
