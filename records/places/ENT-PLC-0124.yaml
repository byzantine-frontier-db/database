  analytical_summary: 'A small coastal thughūr settlement at the north of the Bay of
    Iskenderun, likely identified with the harbour tell of Mutallip Höyük. Built in
    the Umayyad period under ʿUmar II or Hishām. The evidence for Early Islamic occupation
    is contested across four ceramic examinations 1991–2012 (see INT-0174): the 1991 Özgen
    & Gates survey and Eger''s 2005 autopsy of the Mopsus material reported Early Islamic
    wares, whereas Eger''s 2012 re-examination found none. Late Roman and Middle Islamic
    material is consistently present; the site is obscured by industrial development.'
