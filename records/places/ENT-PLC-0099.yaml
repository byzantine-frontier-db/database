  environmental_setting: Walled town on the Raqqa-Ḥarrān road; city wall 450 x 450
    m (20 ha) enclosing a central mound, church and small mosque. The Late Roman precursor
    was smaller, enclosing c. 7 ha. Main occupation evident from extensive eighth-
    to tenth-century ceramics.
  overall_confidence: 3
  analytical_summary: Tell Mahrē (modern Tell Sheikh Hassan, possibly Greek Therimachon),
    survey site BS 142, a fortified town on the Raqqa-Ḥarrān route. Ibn Khurradādhbih
    lists it as a stop on that road; Yāqūt calls it a fortified town. The Therimachon
    identification is Eger's tentative ('possibly'), hence probably_identified.
