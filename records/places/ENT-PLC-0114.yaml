  frontier_role: Early Islamic irrigation canal on the west bank of the Middle Euphrates,
    parallel to the river for c.33 km.
  overall_confidence: 3
  analytical_summary: Constructed canal running parallel to the Euphrates on its western
    bank for c.33 km, with 14 associated sites (several on tells). Textual tradition
    attributes its digging to the Umayyad prince Saʿīd al-Khayr b. ʿAbd al-Malik,
    but soundings, ceramics and radiocarbon uniformly indicate a ninth-century date;
    Eger suggests an Umayyad origin developed under Abbasid ascendancy.
