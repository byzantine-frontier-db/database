  analytical_summary: 'A Late Neolithic tell (excavated by Manchester/UCLA) whose
    summit yielded a Late Roman-Middle Islamic Christian rural settlement, excavated
    2004-6. Features: a fourth-century ashlar enclosure; a buried hoard of 287 Constantinian
    coins (mainly 313-347); ~48 Christian burials (9th/10th c.); ~14% pig bone in
    Early Islamic levels; a chancel-screen fragment. Eger reads it as a Jacobite Syriac
    Christian community showing continuity, not disruption. [Ch. 1, pp. 54-55.]'
