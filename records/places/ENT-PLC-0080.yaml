  overall_confidence: 3
  analytical_summary: Frontier outpost (Greek Taranta) projecting westward like a
    finger toward Byzantine territory. Held an Islamic garrison between 702 and 719
    and was regarded as a Paulician fortress in 872; lay in the main valley as a maslaḥa
    on the Malatiya-Cappadocia road. Identified with modern Darende, consistent across
    Eger's 2008, 2012 and 2015 publications (an earlier Gürün reading is corrected in the notes).
