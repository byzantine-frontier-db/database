  notes: 'Session 7 (Phase 2) enrichment from Eger 2008 (SRC-0065), pp. 536-537: §1 gazetteer
    coordinate (ATT-0488) and §4 dated autopsy of 19 Aug 2005 (ATT-0489 / ASR-0252). §2 history
    in the gazetteer names no primary source (footnotes cite only Ramsay, Le Strange, and Eger''s
    own "Places"), so no §2 primary attestation was minted. IDENTIFICATION CORRECTED 2026-07-15
    (Item E): Ṭaranda is identified with modern DARENDE. Eger''s position is consistent across three
    publications — the 2008 dissertation appendix (SRC-0065; coordinate + 2005 Personal Observations
    at Darende), the 2012 monograph (SRC-0079, p. 183; same UTM point), and the 2015 monograph
    (SRC-0007, route context). The earlier Phase-1 note leaning toward Gürün / the Mazikiran Pass was
    a MISREADING of Eger 2015, p. 107: "Routes to Byzantine lands west of Malatiya traversed the
    Mazikiran Pass at Ṭaranda and modern Gürün in the foothills of the Taurus, leading to Qaysariya."
    That sentence lists Ṭaranda and Gürün as two distinct waypoints on the west-going route ("at [X]
    and [Y] in the foothills"), not as an identification of Ṭaranda with Gürün; the missing comma made
    it read like an appositive. The route-geography claim is now attested separately (ATT-0515,
    modern_synthesis, SRC-0007) and kept distinct from the identification. No Phase-1 InterpretationRecord
    existed for the Gürün reading (it lived only in this note and ATT-0488), so none needed retraction.'
