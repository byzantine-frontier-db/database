  analytical_summary: Former Byzantine and Ghassanid centre (Sergiopolis/Ruṣāfa) far
    to the east near Raqqa, developed by Hishām ibn ʿAbd al-Malik with small quṣūr
    residences, gardens and canals; more like a "desert castle" than a thughūr town.
    Ibn Buṭlān describes a mainly Christian community and way station at a crossroads
    of routes from Dimashq and Ḥimṣ. Counted among the ʿawāṣim.
