  analytical_summary: 'A 46-hectare site of the twelfth-to-thirteenth centuries (Zangid
    and Ayyubid periods) in the Khabur region. The tell served as a residential quarter
    while the large lower town was devoted to commercial activity: two khānāt, a market
    with iron-, glass-, ceramic- and textile-working workshops, and a bath. A mosque
    attached to the khan and a church suggest mixed Muslim-Christian occupation or
    a Christian community serving Muslim caravans. The khānāt and market were violently
    burnt and destroyed during the political upheavals of the thirteenth century,
    with weapons found in the destruction levels.'
