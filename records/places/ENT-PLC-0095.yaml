  environmental_setting: Euphrates tributary of the Diyār Muḍar; narrow (c. 6 m wide
    per Eger), rising from subterranean springs in the Harran Plain — at ʿAyn al-ʿArūs
    or, per Ibn Serapion, at ʿAyn al-Dhabbāniyya / al-Dhahbāna — fed by further streams
    including the Wādī Ḥamār, and emptying into the Euphrates at Raqqa. Floodplain
    c. 70 km E-W and c. 100 km N-S, bordered by limestone and gypsum plateaus.
  overall_confidence: 5
  analytical_summary: The Balikh, with the Harran Plain, forms one topographic unit
    and the principal watershed nucleus of settlement in the western Jazīra. Its valley
    is the subject of the Balikh-half settlement discussion. The disagreement over
    its spring-source (ʿAyn al-ʿArūs vs Ibn Serapion's ʿAyn al-Dhabbāniyya) is preserved
    in the attestations rather than adjudicated.
