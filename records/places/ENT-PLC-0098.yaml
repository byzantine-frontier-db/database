  overall_confidence: 4
  analytical_summary: 'Ḥiṣn Maslama / Madīnat al-Far (survey site BS 187), named after
    its founder Maslama b. ʿAbd al-Malik, son of ʿAbd al-Malik. Two occupation phases:
    an early-eighth-century phase scarcely represented, and a late-eighth/early-ninth-century
    ʿAbbāsid phase to which most visible large-scale building belongs; little evidence
    of occupation after c. 860. Functioned as a way station / garrison connecting
    Raqqa-Ḥarrān (S-N) and Jisr Manbij-Raʾs al-ʿAyn (W-E). Eger uses it as the type
    case for his argument that the ḥuṣūn developed from quṣūr desert estates with
    agricultural holdings (interpretation recorded separately).'
