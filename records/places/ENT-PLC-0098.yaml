  environmental_setting: 'Large walled compound (over 100 ha) on the Balikh road,
    c. 3 km from the Balikh, surrounded by canals bringing water to irrigate fields.
    Three elements: a central elevated rectangular enclosure (80 x 40 m) of two adjacent
    walled houses; a large northern enclosure (330 x 330 m) with corner towers, eight
    intermittent tower buttresses, gates, outer ditch and street grid; and a loosely
    planned southern residential compound.'
  chronology:
