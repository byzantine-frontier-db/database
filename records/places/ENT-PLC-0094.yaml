  frontier_role: Northern-Mesopotamian region between the Tigris and Euphrates, behind
    the eastern thughūr; topographically a frontier hinterland analogous to the relationship
    of the ʿawāṣim to the central thughūr. Administratively divided into three tribal
    districts (Diyār Muḍar, Diyār Rabīʿa, Diyār Bakr).
  environmental_setting: Region defined by the two principal Euphrates tributaries,
    the Balikh (in the Diyār Muḍar) and the Khabūr (in the Diyār Rabīʿa), with intervening
    pasturelands; mixed rain-fed and irrigated agriculture, strong pastoralist component.
  overall_confidence: 5
  analytical_summary: The Jazīra (northern Mesopotamia) is the overarching region
    of Eger 2015 ch. 4. Though not formally part of the thughūr or ʿawāṣim provinces,
    Eger treats it as a frontier hinterland; al-Ṭabarī notes Qarqīsiyā and al-Mawṣil
    were thughūr cities of al-Kūfa in the early conquest. This record anchors the
    Balikh-half settlement entities. The Diyār Rabīʿa / Khabūr material is deferred
    to the Khabūr-half session.
