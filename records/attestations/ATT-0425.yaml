  paraphrase: Eger locates al-Maṣṣīṣa (classical Mopsuestia; modern Misis/Yakapınar) on the
    Jayhān (Pyramus) River in the eastern lower Cilician Plain, on a natural limestone ridge
    at the edge of the Cebelinur (Misis Dağ), about 32 km east of Adhana and 72 km from Ṭarsūs;
    the town straddled the river as two settlements — Maṣṣīṣa on the west bank (modern Yakapınar)
    and the suburb Kafarbayyā on the east (modern Misis) — and commanded the trade routes
    into the plain and a river port navigable to Kum Kalesi.
