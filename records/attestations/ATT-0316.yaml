  citation: al-Balādhurī, Futūḥ al-buldān (1957-8), pp. 217-18, 221; reached via Eger
    2015, pp. 295-6.
  paraphrase: al-Balādhurī treats the Jarājima at length as Christians of the Amanus
    (al-Lukkām) centred on the town of al-Jurjuma, between Bayās and Būqā near the
    Maʿdin al-Zāj (vitriol/copperas mine); Arabic and Syriac texts call them brigands
    (luṣūṣ; Garegūmāyē / Marīdāyē). He also glosses the al-rawādif ('those who follow')
    as possibly including former slaves of the Muslims who joined their cause.
  confidence: 4
  notes: The Jarājima themselves cannot be minted as a group EntityRecord (schema
    v1 has no group record type); attestation anchored to the Amanus and al-Jurjuma.
    Maʿdin al-Zāj deferred.
