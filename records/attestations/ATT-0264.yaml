  citation: 'Eger 2015, pp. 234-235 (citing fns 105-106: Kennedy; Bianquis; von Sivers).'
  paraphrase: Pro-Umayyad southern-Iraqi tribes (e.g. the Kinda from Kūfa and the
    Tanūkh) were settled around Qinnasrīn for iqṭāʿ under Umayyad-family governors;
    Mālik b. Ṭawq al-Taghlibī obtained lands and waterwheels from Hārūn al-Rashīd
    at the future Raḥba near the outlet of the Khabūr; in the Abbasid period the eastern
    frontier as far as Malaṭya was administered by tribal governors, and al-Manṣūr
    settled 4,000 soldiers at Malaṭya with farmland to unseat the pro-Umayyad allies
    of Marwān II.
