  citation: Qudāma b. Jaʿfar, Kitāb al-Kharāj (trans. 'Taxation in Islam'), pp. 60-62;
    reached via Eger 2015, p. 214.
  paraphrase: 'Qudāma discusses the sharing of water rights and local canal-digging:
    excavation was a shared communal activity, but cleaning, damming and supervising
    the canals were directed by the Imam ''from the moneys of the Muslims''. For al-Mahdī''s
    time he cites another scholar that, along the great rivers, digging, bridge-construction,
    canal-clearing and dam-maintenance were paid for from the state treasury.'
  location_within_source: pp. 60-62.
