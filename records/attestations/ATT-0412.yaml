  citation: al-Balādhurī, Futūḥ al-buldān (SRC-0016); reached via Eger 2008, Appendix 2, s.v.
    Malaṭiya, pp. 487–492 (SRC-0065).
  paraphrase: al-Balādhurī reports that ʿIyāḍ b. Ghanm took Malaṭiya under the direction of Ḥabīb
    b. Maslama al-Fihrī in the reign of ʿUmar I, settling people there from Ṭaranda; that Ḥabīb,
    sent by Muʿāwiya as governor of Syria and the Jazīra, reconquered it by force in 653–654
    and stationed a cavalry; and that al-Manṣūr (756/57–757/58) ordered al-Ḥassān b. Qaḥṭaba
    to rebuild the city with a mosque and city wall, settling a garrison of 4,000 soldiers.
  confidence: 3
  notes: Section-2 conquest-and-refoundation narrative attributed to Balādhurī by Eger. May overlap
