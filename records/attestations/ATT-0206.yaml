  paraphrase: Hostel/inn way stations named funduq were mentioned mainly in Cilicia
    (al-Funduq near Massisa; Funduq al-Husayn, through which al-Muʿtaḍid passed in
    900; Funduq Bughā, built on the orders of Bughā al-Saghīr (d. 862), and Funduq
    al-Jadīd, between Adhana and Tarsus); their designation as funduq rather than
    ḥiṣn suggests use by pilgrims and merchants rather than fortification.
