  citation: Eger 2008, Appendix 2, s.v. Ṭarsūs, pp. 538–550 (SRC-0065), reporting excavations by
    A. Özyar (Bryn Mawr, Gözlü Küle), L. Zoroğlu and Ç. Toskay-Evrin (Cumhuriyet Meydanı), the 1935
    work of H. Goldmann, and S. Keskil (Yeşiltepe/Cleopatra's Hill, 1970).
  paraphrase: Three excavation programmes at Ṭarsūs bear on the Early Islamic city. At the Gözlü
    Küle mound (excavated for Bryn Mawr under A. Özyar; earlier by Goldmann, whose 1935 sequence
    ran to the late seventh century CE) Islamic settlement is indicated mainly by reused/recycled
    classical masonry and by ʿAbbāsid and Saljūq coins, oil lamps and creamware in the Tarsus Museum
    collection, with no securely dated Islamic stratum. The Cumhuriyet Meydanı excavations (L. Zoroğlu;
    ceramics by Ç. Toskay-Evrin) exposed a colonnaded classical street with market buildings later
    transformed toward an Islamic sūq. Keskil's 1970 salvage at Yeşiltepe yielded ʿAbbāsid and Saljūq
    coins, oil lamps and Sāmarrā-horizon ceramics.
  confidence: 3
  notes: Section-3 published archaeology, credited to the excavation teams; routed as archaeological_evidence
    (not primary_observation). Supports ASR-0253. editorial_review_required.
