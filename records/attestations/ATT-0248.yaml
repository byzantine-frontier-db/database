  citation: Eger 2015, pp. 220-222, reporting Amuq Valley and Kahramanmaraş survey
    data and geomorphology.
  paraphrase: On the Amuq, both the ʿAfrīn Canal and Yaghra River sites grew from
    the Late Roman period to the tenth century while gradually shifting away from
    the marshes; by the ninth–tenth centuries several sites nearest the lake were
    wholly surrounded by wetlands. The Nahr Hurith/Ak Su Canal sites on the Kahramanmaraş
    Plain are physically much smaller, and two of three incorporate a tell and lower
    town within the irrigation network. New island sites appeared in the swamps —
    one of c. 3.3 ha within the Lake of Antioch in the seventh/eighth centuries, and
    Tell Wasta (0.9 ha) on a rocky outcrop in the Jabbūl salt marshes (Roman/Late
    Roman in date).
  location_within_source: pp. 220-222.
