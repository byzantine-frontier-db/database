  citation: Constantine VII Porphyrogennetos, De Cerimoniis, 694.22-695.14, trans.
    E. McGeer, pp. 365-6
  paraphrase: A short text in the De Cerimoniis states that Muslims who are baptised
    may receive a start-up grant of money, oxen and seed grain plus three years' tax
    exemption, and that households taking in converted captives as 'sons-in-law' (gambroi)
    likewise receive three years' exemption — a Byzantine mechanism of incorporation
    aimed at encouraging conversion, sedentarisation and agrarian productivity.
