  notes: 'Rule 12 — thin one-clause primary citing a source already in the corpus (SRC-0016), attested inline rather than deferred. Edition/page unspecified by Eger — [citation needed: pending printed confirmation]. Date variance preserved, not reconciled: 711–13 vs 808–10 (the latter Balādhurī''s report after al-Wāqidī). Ibn Shaddād (SRC-0023), Ibn al-ʿAdīm (SRC-0057) and Yāqūt (SRC-0020) are named by Eger as parallel witnesses to the earlier date; al-Wāqidī is not in the corpus (mint deferred). Classical witnesses Eger cites for Sīs (Cicero on Pindenissus; the Antonine Itinerary''s Flaviada) are not in the corpus — deferred. RESOLVED (minting pass 2026-07-13): Cicero → ATT-0484 (SRC-0075), Antonine Itinerary → ATT-0483 (SRC-0074), al-Wāqidī → ATT-0482 (SRC-0073).'
