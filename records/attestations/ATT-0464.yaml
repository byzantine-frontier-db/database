  paraphrase: al-Balādhurī reports that the inhabitants of Sīs abandoned the town toward the
    'Greek mountains'; Eger notes the sources diverge on the date — 711–13 (per Balādhurī with
    Ibn Shaddād, Ibn al-ʿAdīm and Yāqūt) or 808–10 (Balādhurī after al-Wāqidī) — after which
    the town fell into ruin until its mid-ninth-century restoration.
