  citation: Eger 2008, Appendix 2, s.v. Al-Maṣṣīṣa, pp. 501–509, "Personal Observations, 8/3/04"
    (SRC-0065).
  paraphrase: On a visit of 3 August 2004 Eger observed the two halves of al-Maṣṣīṣa surviving
    as two villages either side of the deeply incised Jayhān, with the reconstructed Roman-form
    bridge and its original foundations still visible; on the west-bank limestone plateau
    (40–50 ft high) he recorded stretches of wall in large ashlars and reused columns amid
    a village that incorporates cut stone from the site into nearly every structure, plus
    a preserved Medieval/Ottoman mill extending into the river; on the east bank, just north
    of the bridge, he found the limestone-ashlar western wall of a building with a large portal
    arch whose acanthus-and-medallion border looked classical but whose pointed (non-classical)
    arch marks it as later, taken as confirming settlement on both banks, and noted a dense
    artefact scatter around the Misis Archaeological Museum rise.
