  citation: Ibn Buṭlān, Letter on the journey from Ḥalab to Anṭākiya (1051), in G.
    Le Strange, Palestine under the Moslems, p. 370, also quoted by Yāqūt, Muʿjam
    al-buldān, 2.266-70; reached via Eger 2015 p. 69 n. 1.
  confidence: 4
