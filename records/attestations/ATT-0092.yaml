  paraphrase: On a journey from Ḥalab to Anṭākiya in 1051, Ibn Buṭlān found the whole
    country populous and continuously cultivated -- wheat and barley under the olive
    trees, continuous villages, gardens, and flowing water -- with no ruined abodes;
    the traveller passing in contentment and peace.
  notes: Translation paraphrased rather than quoted, per fair-use rule. Cross-links
    to the existing source SRC-0021 (Ibn Buṭlān) and to SRC-0020 (Yāqūt, who transmits
    the passage).
