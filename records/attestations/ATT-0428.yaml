  direct_quotation: the people are agreeable, the markets numerous, and the ways excellent
  paraphrase: 'Writing c. 943, al-Iṣṭakhrī describes al-Maṣṣīṣa and Kafarbayyā as two well-fortified
    towns on elevated ground either side of the Jayhān, connected by the Roman bridge, with
    the congregational mosque affording a view to the sea four leagues away, and praises the
    town: ''the people are agreeable, the markets numerous, and the ways excellent.'''
