  citation: Eger 2015, pp. 226-228 with Figure 28 (comparative way stations).
  paraphrase: Eger groups a set of Early Islamic 'fortified square enclosures' — Hisn
    al-Tīnāt (Plain of Issus), Būqā (Amuq), Kurban Höyük (Karababa Basin), Site 17
    (Jerablus/Carchemish), Site 4/Pınar Tarlası, Ḥiṣn Maslama (Balikh) and Tell Brak
    (Khabūr) — sited on south–north routes. They are mainly single-period (founded
    8th c., abandoned by 12th), retain the qaṣr layout but are smaller and variable
    in size, and are often undecorated; some may be misidentified Roman forts (e.g.
    Tell Brak). They are best categorised as way stations, distinct from ribāṭ, and
    were probably called ḥuṣūn.
  location_within_source: pp. 226-228; Figure 28.
