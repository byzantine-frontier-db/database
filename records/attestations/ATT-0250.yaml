    is NOT confidently matched to ENT-PLC-0060 (''Jarablus Tahtani Survey Site 17'')
    because the survey names differ; left unlinked pending review. Pınar Tarlası matched
    to ENT-PLC-0059; Būqā to ENT-PLC-0029.'
