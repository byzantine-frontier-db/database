  paraphrase: Although Arabic sources imply a wholly new foundation, Hārūn al-Rashīd
    in fact only repaired ʿAyn Zarba's circuit wall and citadel in 796 and garrisoned
    it with Khurāsānī troops under his eunuch Abū Sulaym, who drew settlers by granting
    houses as iqṭāʿ; Abū Sulaymān al-Turkī al-Khādim further fortified the town in 804.
