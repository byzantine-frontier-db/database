  paraphrase: The Ḥabīb clan of the Banū Taghlib (12,000 horsemen with families) allied
    with the Byzantines in 935 and defected from Ḥamdānid-controlled Naṣībīn into
    Byzantine lands, where they were given lands, animals and goods; they then raided
    Islamic lands annually at harvest, chiefly in the Diyār Muḍar, seizing frontier
    forts such as Ḥiṣn Ziyād and Ḥiṣn Manṣūr.
