  citation: Eger 2008, Appendix 2, s.v. Al-Ḥadath (al-Ḥamrāʾ), pp. 458–462, "Personal
    Observations, 9/25/04" (SRC-0065).
  paraphrase: 'On a visit of 25 September 2004 Eger found the site in the Gölbaşı
    valley at the village of Bozlar (not Başpınar), squarely at the entrance of a
    Taurus pass (the Darb al-Ḥadath) near a spring: a massive city wall preserved
    for some 50 m in limestone ashlar with a rubble-and-mortar core and square buttresses
    at intervals, its top under plough and modern houses, with pottery ranging Roman
    through Early Islamic. A rounded hill to the west, nearer the pass, he suggested
    might be the fortified al-Uhaydab, though he did not investigate it.'
