  citation: Eger 2008, Appendix 2, s.v. Shimshāṭ, pp. 521–522 (SRC-0065), reporting published
    excavation and survey.
  paraphrase: 'The site of Haraba was excavated in 1969, 1970 and 1973 under the Keban Dam salvage
    project, with six trenches chiefly on the south-east of the hill following the walls: the
    excavators found a Hellenistic upland castle and a lower walled town they judged medieval
    and possibly Saljūq, with a semicircular tower and a city gate facing the Murat River —
    an arrangement (upland Hellenistic, lowland Middle Islamic) Eger calls curiously inverted.
    Sinclair reports the site later split into seven villages bearing the name Arşimşat, one
    being Haraba; the site was flooded by the Keban Dam Lake in 1974. There is no reported Early
    Islamic architecture or pottery.'
