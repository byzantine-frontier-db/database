  provenance: primary_paraphrase
  citation: al-Balādhurī, Futūḥ al-buldān (SRC-0016), followed by Ibn Shaddād; reached via
    Eger 2008, Appendix 2, s.v. Qūrus, pp. 513–516 (SRC-0065).
  paraphrase: al-Balādhurī (and, following him, Ibn Shaddād) reports that Abū ʿUbayda distributed
    his cavalry and subdued the whole province of Qūrus as far as Nikabulus (Islahiye) between
    the Amuq and Kahramanmaraş plains, that Qūrus served as Antioch's forward garrison watching
    the enemy — receiving a seasonal detachment of some 1,500–2,000 men each spring until
    one of Antioch's four army divisions was permanently transferred to it — and that Salmān
    b. Rabīʿa al-Bāhilī of Abū ʿUbayda's army occupied its fort, thereafter named Ḥiṣn Salmān
    after him.
  confidence: 3
  notes: Section-2 primary datum (conquest and garrison arrangements). Attested primary is
    al-Balādhurī (SRC-0016); Ibn Shaddād (SRC-0023) follows him. The garrison passage is paraphrased
    rather than quoted. Edition/page unspecified by Eger. Distinct from the existing ʿawāṣim-listing
    attestation ATT-0126 (al-Balādhurī).
