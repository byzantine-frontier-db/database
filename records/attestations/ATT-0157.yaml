  paraphrase: Eger describes the Balikh/Harran Plain topographic unit and its hydrology,
    and notes that in the Late Roman period Edessa (Ruhā) and Karrhai (Ḥarrān) in
    the Osrhoene province were the focal urban centres, fortified by Justinian, before
    being replaced by Balikh-valley settlement in the Early Islamic period.
  confidence: 4
  notes: Eger's own synthesis of the physical geography and the Late Roman urban pattern;
    attested against SRC-0007 directly. The "fortified by Justinian" detail derives
    ultimately from Procopius (cf. SRC-0024) but Eger gives no citation at this point,
    so it is attested here as Eger's statement; a Procopius-based attestation is deferred
    pending verification.
