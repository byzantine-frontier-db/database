  paraphrase: al-Balādhurī records that after an earthquake left the city in ruins, al-Manṣūr
    rebuilt the walls of al-Maṣṣīṣa and repopulated it with more than 8,000 settlers from
    Syria and Persia in 757, renaming it al-Maʿmūriya, with a permanent garrison reaching
    2,000 soldiers and the congregational mosque rebuilt over the ancient temple under Ṣāliḥ
    b. ʿAlī.
