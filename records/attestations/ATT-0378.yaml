  citation: Eger 2008, Appendix 2, s.v. Ḥiṣn Manṣūr, pp. 472–474 (SRC-0065).
  paraphrase: Eger argues Ḥiṣn Manṣūr was an Umayyad rather than an ʿAbbāsid foundation, named
    not for the caliph but for the Qaysī commander Manṣūr b. Jaʿwana b. al-Ḥārith al-ʿĀmirī
    (governor of al-Ruhā/Edessa under Marwān II), who was ordered to build or repair the town
    against Byzantine incursions c. 750 and garrisoned it; after his patron ʿAbdallāh's death
    in 758 the town fell to ruin and was later refortified and re-garrisoned by Hārūn al-Rashīd
    during al-Mahdī's caliphate.
  confidence: 3
  notes: 'Section-2 foundation narrative synthesised by Eger. The naming tradition is credited in the entry to Abū ʿAmr al-Bāhilī, who has no SourceRecord and is a single-source mention: DEFERRED to the backlog minting queue, not minted mid-session. Attested as modern_synthesis against SRC-0065 (provenance honesty) rather than against the unminted al-Bāhilī. STILL DEFERRED (source-minting pass 2026-07-08): Abū ʿAmr al-Bāhilī remains unminted — a naming tradition credited to a named tradent with no citable work (category: named tradent, unknown author; cf. the Jawzāt roster).'
