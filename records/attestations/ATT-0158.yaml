  citation: Eger 2015 (SRC-0007), pp. 140-141 (reporting Wilkinson, Western Jazira
    Archaeological Landscape Project)
  paraphrase: Eger reports that the sixth- to eighth-century Balikh landscape was
    dominated by a major straightened canal (Nahr al-Abbāra / Nahr Turkmān) running
    parallel down the east side of the valley, replacing an earlier smaller Sahlān-Ḥammām
    system; sites were aligned along it, and after diverting water from the river
    it re-emptied just south of Tell Hammam et-Turkmān.
  confidence: 3
  notes: Eger's synthesis of Wilkinson's landscape survey; attested against SRC-0007.
    The canal's identification with Hishām's 724 canal is treated as interpretation
    (INT-0046).
