  citation: Eger 2015 p.200
  paraphrase: 'Eger characterises the early Islamic urban transformation in the ʿAwāṣim:
    Anṭākiya''s reduction in urban scale, Ḥalab''s rise to ʿawāṣim qaṣaba (administrative
    centre), and the growth of secondary settlements such as ʿImm and Baghras around
    water mills and canals. Anṭākiya in particular is presented as a case of rus in
    urbe — rural-style settlement persisting within urban space.'
