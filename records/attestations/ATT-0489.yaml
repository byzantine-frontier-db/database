  citation: Eger 2008, Appendix 2, s.v. Ṭaranda, pp. 536–537, “Personal Observations, 8/19/05” (SRC-0065).
  paraphrase: 'On a visit of 19 August 2005 Eger observed Ṭaranda just west of modern Darende, in
    mountainous southern-Taurus terrain of deeply weathered karst limestone unlike the rest of the
    thughūr, the site lying in a valley beside a strong-flowing river. Toward the Sonunucu Baba pilgrimage
    site he noted traces of the ancient settlement: several square Syrian minarets (probably 13th–14th
    century), a well-preserved Ottoman market, and a small fortification (Zengibar Castle). He inferred
    that the ancient site lies near the “minarets without mosques” (Eskişehir); a detailed survey
    of the house-covered area was not carried out.'
