  provenance: primary_paraphrase
  citation: Ibn Shaddād, al-Aʿlāq al-Khaṭīra, p. 423 (via Eger 2015, SRC-0007, p.
    271 n. 17)
  paraphrase: Ibn Shaddād describes Artāḥ (Greek Artesia) as a small town (madīnatun
    saghīratun) possessing gardens (basātīn), springs (ʿuyūn), mills (arḥāʾ) and villages
    (qurā); four dependent villages are named, including the nearby Tell al-Judaidah.
    Eger reads Artāḥ as an example of the conglomerate village and of 'nucleated dispersal'.
  confidence: 4
  notes: Eger p. 271. The four named villages (al-Ḥaṭṭānīya, al-Barghārīya, al-Mashʿūfīya,
    al-Jadīda = Tell al-Judaidah; Jacquot, Antioche, centre de tourisme, p. 442) are
    deferred as minor toponyms.
