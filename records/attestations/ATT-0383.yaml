  citation: Eger 2008, Appendix 2, s.v. Ḥiṣn Manṣūr, pp. 472–474, "Personal Observations,
    9/26/04" (SRC-0065).
  paraphrase: On a visit of 26 September 2004 Eger found the town-centre mound of Adıyaman
    a wooded rise among modern houses, smaller than but comparable to Gözlü Kule at Tarsus,
    with classical Perre and its necropolis lying several km to the north; he recovered nothing
    definitely Early Islamic on or around the tell — indeed almost nothing of any period —
    and stressed that, unlike most frontier sites, Ḥiṣn Manṣūr was not founded on the classical
    city and would have guarded east–west and north–south trade routes rather than a mountain
    pass.
