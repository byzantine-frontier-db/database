  citation: Eger 2015, pp. 228-229 (excavation results, Hisn al-Tīnāt).
  paraphrase: Hisn al-Tīnāt lay both on the land route from al-Iskandarūna into Cilicia
    and on the coast as a port. Its third phase (tenth century) saw thickened enclosure
    walls and domestic structures, with dock evidence (amphorae and timber) on the
    shoreline and geophysically detected structures linking enclosure to coast. Locally
    made frontier ceramics and glass occurred alongside imports (perfume and medicine
    bottles, bronze surgical tools, glass bracelets) from Iraq, Egypt and Byzantine
    lands; very few military artefacts were found.
  location_within_source: pp. 228-229.
