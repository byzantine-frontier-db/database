  citation: Eger 2008, Appendix 2, s.v. Al-Kanīsa as-Sawdāʾ (Gözeneler), pp. 479–486, "Personal
    Observations, 8/2/04" (SRC-0065).
  paraphrase: On a visit of 2 August 2004 Eger examined the conspicuous polygonal mortared
    buttress wall outside the theatre — the best-preserved feature — found a Hellenistic/Roman
    sherd set in its mortar and a Syrian yellow-glaze sherd near the top of the city wall,
    and argued that this theatre-wall fortification is Middle Islamic/Medieval rather than
    Early Islamic, since polygonal architecture is rare for the Early Islamic period in the
    region; examining the pottery with Andrea de Giorgi of the 2004 Mopsus Survey he noted
    continuity from Hellenistic through Middle Islamic at Site 1 with Early Islamic and Byzantine
    forms under-represented (which he attributed to the survey team's Iron Age focus), and
    concluded that the Early Islamic settlement was hard to assess but probably occupied a
    small kale on the rocky outcrop with the wider settlement in the classical city.
