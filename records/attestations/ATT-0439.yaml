  citation: Eger 2008, Appendix 2, s.v. Al-Muthaqqab, pp. 510–512 (SRC-0065), reporting published
    survey work.
  paraphrase: 'The identification is debated in the published survey record: Edwards, following
    the geographers, proposed the upland fort of Gökvelioğlu on the Cebelinur spur (rejected
    as inconsistent with the sources'' coastal placement), while Özgen and Gates, Hild and
    Hellenkemper, and Tobin favour the coastal mound of Mutallip Höyük — an ovoid tell 18–20
    m high with Late Roman mortared-rubble walls faced in basalt, a possible harbour wall
    of large basalt blocks, and pottery from the Hellenistic through the Medieval period ''including
    many Islamic period ceramics''; the Mopsus Survey recorded it as Site 15 in 2004.'
  confidence: 3
