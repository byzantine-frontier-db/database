  citation: 'Qudāma b. Jaʿfar, Kitāb al-Kharāj, Bibliotheca Geographorum Arabicorum
    6 (Leiden: Brill, 1889), p. 259'
  paraphrase: 'Qudāma b. Jaʿfar describes the calendar of the annual raids (al-ghazuwāt):
    a 30-day ''springtime'' raid beginning c. 10 May once horses are in condition,
    with pasturing in Roman territory; a return and rest of c. 25 days; a 60-day summer
    raid from 10 July; and shorter winter raids of about 20 days round-trip, completed
    by late February, timed to catch the enemy and their animals weak. The raid seasons
    track pastoral transhumance and the condition of livestock.'
