  paraphrase: Ibn Serapion describes the Nahr al-Qubāqib as rising in Byzantine lands
    and flowing into the Euphrates with a great bridge named after it; watercourses
    brought from the Nahr Malatiya (modern Shakhma Su) into Malatiya before flowing
    into the Qubāqib below the bridge; and six further unnamed forts beyond Hisn Ziyad
    before the Nahr Arsanās joins the Euphrates. Eger also reports Ibn Serapion stating
    that the Qaraqīs passes near the gate of Zibatra.
