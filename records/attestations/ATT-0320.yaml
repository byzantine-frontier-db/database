  paraphrase: 'al-Muqaddasī describes al-Salīq, a former Sasanian city, as a madīna
    on the edge of a lagoon in the southern Iraqi swamps whose fields reach the outskirts
    of al-Kūfa: a harsh, malarial, mosquito-ridden place whose people live on fish
    and warm water, yet a source of abundant flour, water and fish under a benign
    government, its inhabitants reputed good fighters knowledgeable about the river.'
