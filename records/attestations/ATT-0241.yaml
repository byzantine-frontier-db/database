  paraphrase: Simeon of the Olives built at Naṣībīn a large and beautiful mosque next
    to the church, plus a madrasa and a pandocheion (way station), with groves, irrigation
    channels and mills, funding the works from gold and silver found as a hoard by
    his nephew; the Life also reflects that large monasteries such as Qartmīn (Mor
    Gabriel) on the Ṭūr ʿAbdīn could own other monasteries, with rents and agricultural
    proceeds accruing to the monasteries themselves.
