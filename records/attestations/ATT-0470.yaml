  notes: 'Section-2 primary attestation. Ibn Ḥawqal and al-Iṣṭakhrī (ATT-0478) give
    a near-identical recension of this datum; held as two parallel attestations per
    rule 3 and the Hārūnīyya precedent (ATT-0369/0405/0406), split from the former
    joint record. Edition/page unspecified by Eger — [citation needed: pending printed
    confirmation]. Complements ATT-0127 (Ibn Ḥawqal''s bare list-mention of Sumaysāṭ
    alongside Balis and Sanjah, via Eger 2015 p.96). Both share the source and subject;
    retained as distinct because ATT-0127 is a list-membership datum while this is
    the substantive description.'
