  citation: Ibn Ḥawqal, Kitāb Ṣūrat al-Arḍ (SRC-0009); reached via Eger 2008, Appendix
    2, s.v. Sumaysāṭ, pp. 525–535 (SRC-0065).
  paraphrase: Ibn Ḥawqal, writing c. 951, describes Sumaysāṭ as a small city on the
    Euphrates with irrigated and rain-fed lands and a fortress, drawing its drinking
    water from the river — which Eger reads as implying the aqueduct had by then ceased
    to function.
