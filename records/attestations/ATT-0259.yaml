  citation: 'Eger 2015, p. 233 (citing fns 98, 100: Whitcomb).'
  paraphrase: 'Eger proposes that urban development in Islamic Cilicia began with
    an encampment growing separately from a continuously inhabited town: the ḥīra
    at many sites is the earliest Islamic presence, a camp outside a preexisting city
    that becomes a permanent camp (ḥāḍir) and then an urban quarter; Whitcomb''s two-room
    structure at Qinnasrīn (mud brick then stone) is read as a tent that became a
    permanent foundation (sibāṭ) at the dawn of the Abbasid period.'
