  direct_quotation: frogs
  paraphrase: al-Ṭabarī records that the revolting Zuṭṭ — derided as 'frogs' — travelled
    and fought by skiff, forcing Abbasid troops to do the same and to block the canals;
    after their defeat al-Muʿtaṣim's commander Ujayf deported 27,000 of them, first
    to Khāniqīn north of Baghdad and then to ʿAyn Zarba on the thughūr, where in 855
    a Byzantine raid carried off Zuṭṭ women, children and livestock.
