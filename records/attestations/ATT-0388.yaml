  citation: Eger 2008, Appendix 2, s.v. Ḥiṣn Ziyād, p. 475 (SRC-0065).
  paraphrase: Eger relays that the site may be named for a Ziyād, a Slav stationed on the
    thughūr by Marwān b. Muḥammad; that c. 930 it was seized by the defecting Ḥabīb; that
    a Jacobite bishopric is attested there between 1027 and 1038; and that it was held by
    the Artuqids in the 12th century.
