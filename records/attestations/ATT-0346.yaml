  paraphrase: Working the site on 3 August 2004 with R. Posamentir's DAI (Istanbul)
    team, Eger recorded a flat scrub landscape grazed by sheep and goats; the standing
    architecture is identifiably Roman or Late Roman/Byzantine, with two tile baths
    surviving exceptionally well amid deep sedimentation (a local villager reporting
    ~4 m), possibly reused as pottery kilns; the monumental arch is in precarious disrepair
    and many of its stones — including inscribed blocks sought for the Kufic text —
    have been removed by house-building.
