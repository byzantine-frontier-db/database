  citation: 'Eger 2008, Appendix 2, s.v. Sīs (Sīsīya), pp. 523–524, "Personal Observations:
    07/20/04" (SRC-0065).'
  paraphrase: On a visit of 20 July 2004 Eger observed that the Flaviopolis/Sīs Late Roman and
    Early Islamic settlement would have been a key market town for pass traffic; that the lower
    town's precise location is unknown and most likely covered by modern Kozan, where extensive
    development hampered survey; that a river runs through the town; and that the castle is
    precarious and strongly walled — a fortress rather than a town — commanding the Cilician
    Plain to the south, with further buildings at the base of the outcrop probably related to
    the Armenian castle.
