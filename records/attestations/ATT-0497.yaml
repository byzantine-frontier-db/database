  citation: Eger 2008, Appendix 2, s.v. Ṭarsūs, pp. 538–550, “Personal Observations, 7/05” (SRC-0065).
  paraphrase: 'On a visit of July 2005 Eger examined the Ṭarsūs material at first hand: the Cumhuriyet
    Meydanı colonnaded street under 2–3 m of overburden containing medieval remains; a museum assemblage
    of Early Islamic lamps, intact buffware jugs and juglets, and two restored holemouth brittleware
    cooking pots with rocker decoration, together with ʿAbbāsid, Faṭimid, Ayyūbid and Mamlūk coins
    including a hoard of ʿAbbāsid silver dirhams (mislabelled ‘emevian’). At the contemporaneous
    salvage excavation of the Roman bath he found abundant Early and Middle Islamic ceramics and
    a combined glass-and-ceramic kiln, paralleling the pattern he had seen at Anṭākiya and Kanīsa
    al-Sawdāʾ; at the Gözlü Küle mound to the south little was visible beyond pottery on the southern
    slope.'
