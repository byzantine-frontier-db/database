    fn 104.
  direct_quotation: to settle the Arabs in places far from the cities and villages
  paraphrase: Balādhurī reports that ʿUthmān instructed Muʿāwiya, ruler of Syria and
    the Jazīra, to settle the Arabs far from cities and villages and to let them use
    unowned land; accordingly the Banū Tamīm were settled at ar-Rābiyah, a mixed multitude
    of Qays, Asad and others at al-Māzihīn and al-Mudaibir, the same in Diyār Muḍar,
    and the Rabīʿah in their Diyār.
  confidence: 4
  notes: Tribal/group entities (Banū Tamīm, Qays, Asad, Rabīʿah) and minor toponyms
    (ar-Rābiyah, al-Māzihīn, al-Mudaibir) deferred.
