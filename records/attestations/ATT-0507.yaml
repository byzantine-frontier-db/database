  citation: 'Eger 2008, Appendix 2, s.v. Zibaṭra, p. 551, “Personal Observations, 8/19/2005” (SRC-0065).
    [citation needed: exact page span — page-map conflates Tīzīn/Zibaṭra at p. 551].'
  paraphrase: On a visit of 19 August 2005 Eger examined the ruins at Doğanşehir (reached via the
    Gölbaşı–Malatya road). Beside the river he found largely intact city walls, unfaced but with
    discernible corners, gates and towers, running along both sides of the modern road and suggesting
    a double city wall strongly reminiscent of the walls of Ḥadath and Malaṭiya; modern houses are
    built over the site and its earlier walls. The Dere Su runs lush along the east side with a mill.
    He discerned no surface pottery, but noted he had walked only the clean cobbled modern roads,
    not the houses or gardens. The site lies in a small mountain-ringed valley off the Gölbaşı and
    Malatya valleys and is known to locals simply as the ‘Kale’.
