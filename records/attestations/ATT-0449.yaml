  citation: Eger 2008, Appendix 2, s.v. Raʿbān, pp. 517–518, "Personal Observations, 7/24/05"
    (SRC-0065).
  paraphrase: On 24 July 2005 Eger found the town of Araban backed to the east by a prominent,
    flat-topped tell of medium size — possibly the largest in both the Kara Su and Merzumen
    Dere valleys — with many buildings showing in the eroding section; pottery was scarce
    on top but represented all periods, and while he found no definite Early Islamic ware
    he did recover Raqqa ware of the tenth/eleventh century; a lateral stone Ottoman mosque
    atop the tell reused spolia, its mihrab flanked by Corinthian capitals. He inferred the
    Early Islamic town most likely lies beneath the modern city and could not locate it, investigation
    being hampered by modern development.
