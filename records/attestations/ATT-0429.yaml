  paraphrase: Yāqūt reports that the old city wall of al-Maṣṣīṣa had five gates and the wall
    of Kafarbayyā four, the latter strongly built and furnished with markets, and gives an
    Islamicised eponymous foundation for the town, attributing its name to Maṣṣīṣa b. al-Rūm,
    a grandson of Sām (Shem).
