  paraphrase: Eger reports, following Cobb, that the Jarājima leader Bundār (Theodore),
    from the village of Munayṭira, led an early-Abbasid revolt against taxation in
    Lebanon, drawing in disenfranchised peasants and runaway slaves and plundering
    Baʿlabakk and the Biqāʿ, before being suppressed and resettled by Ṣāliḥ b. ʿAlī,
    governor of Syria under al-Manṣūr.
