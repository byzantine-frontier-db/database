  citation: al-Balādhurī, Futūḥ al-buldān (1957-8), p. 230; reached via Eger 2015,
    p. 304.
  paraphrase: 'al-Balādhurī records the early frontier settlements of marsh populations:
    Muʿāwiya settled Zuṭṭ and Sayābija families from Baṣra at Anṭākiya and Būqā in
    669/70; under al-Walīd I some 4,000 water buffalo (male and female) were brought
    from India to the frontier; Yazīd b. ʿAbd al-Malik sent a further 4,000 female
    water buffalo and their Zuṭṭ keepers to al-Maṣṣīṣa (taken from al-Muhallab), bringing
    the total there to some 8,000.'
  confidence: 3
  notes: al-Balādhurī (per Eger's note) records the animals were brought to counter
    a lion menace. al-Walīd I's importation and Yazīd II's transfer not given dedicated
    EventEntities; captured here and anchored to participants/places. al-Muhallab
    deferred.
