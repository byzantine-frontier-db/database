  citation: 'Ibn Buṭlān, letter of 1051, preserved in Yāqūt, Muʿjam al-buldān (Beirut:
    Dār Ṣādr, 1955-7), 4.157 — as transmitted by Eger 2015, p. 52 and ch. 1 n. 23
    (p. 324)'
  paraphrase: Travelling from Ḥalab to Anṭākiya in 1051, Ibn Buṭlān stayed at the
    wealthy Christian town of ʿImm and noted its springs with fish, four churches,
    one mosque and mills; Yāqūt adds that the inhabitants were all Christian and of
    ancient descent.
