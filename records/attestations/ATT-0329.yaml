  provenance: modern_synthesis
  citation: Eger 2015, p. 299 (after Cappel, 'The Byzantine Response to the Arab',
    pp. 116-17).
  direct_quotation: fiercely antagonistic toward any type of outside authority
  paraphrase: Eger reports, following Cappel, that in the early eleventh century the
    mountain districts of the Jabal al-Summāq, Jabal al-Rawādif and Jabal al-Lukkām
    (Amanus) were inhabited by a tribally organized peasantry ('ashāʾir) resistant
    to outside authority; the Jabal al-Rawādif was held by the al-Aḥmar and Ghannāj
    under Naṣr b. Musarraf, with parallel rebellions by the Druze on the Jabal al-Summāq
    and the Munqidh near Shayzar, and the Byzantines enlisted such groups to guard
    the passes between Ḥalab and Anṭākiya.
  confidence: 3
  notes: al-Aḥmar, Ghannāj, Druze and Munqidh are groups; not mintable under schema
    v1. Jabal al-Lukkām = the Amanus (ENT-PLC-0032).
