  paraphrase: al-Balādhurī reports Hārūnīyya as a city one march west of Marʿash founded by
    Hārūn al-Rashīd in 799, while also noting it was begun earlier under al-Mahdī and completed
    in Hārūn's own caliphate; he refers to it specifically as a fort (ḥiṣn).
  confidence: 3
  notes: 'Section-2 secondary-mediated primary attestation (SRC-0065 the route). al-Yaʿqūbī
    corroborates the pre-Hārūn (al-Mahdī-era) construction; a dedicated al-Yaʿqūbī attestation
    is not minted here as the gazetteer folds the two together without distinguishing Taʾrīkh
    (SRC-0003) from Kitāb al-Buldān (SRC-0008). [citation needed: confirm the Futūḥ passage
    against a printed edition.]'
