  citation: Eger 2008, Appendix 2, s.v. Al-Kanīsa as-Sawdāʾ (Gözeneler), pp. 479–486 (SRC-0065).
  paraphrase: Eger presents al-Kanīsa as-Sawdāʾ as a large classical city (Epiphaneia) strengthened
    rather than founded by Hārūn al-Rashīd in 799 alongside Hārūnīyya and ʿAyn Zarba, garrisoned
    with Khurāsānīs; in 806 Nikephoros attacked it while Qāsim b. Rashīd was murābiṭ there,
    and it was defended with dabik (a naphtha resin) and relieved from al-Maṣṣīṣa; it bore
    the nickname al-muḥtariqa ("the Burnt") from an incendiary attack, received deported Zuṭṭ
    under al-Muʿtaṣim in 835, and hosted al-Muʿtaḍid for two days after 899.
  confidence: 3
  notes: Section-2 historical narrative synthesised by Eger with no single primary footnote
    in the prose; modern_synthesis against SRC-0065 (provenance honesty).
