  citation: Eger 2008, Appendix 2, s.v. Sanjah/Bahasnā, pp. 519–520 (SRC-0065), reporting published
    survey.
  paraphrase: 'Sinclair''s survey records a medieval citadel and lower town: the citadel is
    Mamlūk (and perhaps earlier), with a double wall except on the naturally steep north side,
    and a three-storey rectangular Ayyūbid/Mamlūk tower with loopholes and an embossed-stone
    inscription above the middle storey; the curtain wall left of the tower is of inferior,
    possibly earlier construction, and the old town preserves Mamlūk and later mosques. A 2006
    Turkish municipal publication reports further work at the site.'
