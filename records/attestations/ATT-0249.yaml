  citation: Eger 2015, pp. 222-223, synthesising Islamic geographers, 19th–20th-c.
    travel/survey accounts (British Admiralty Handbook for Asia Minor 1919; Cuinet,
    La Turquie d'Asie) and geomorphology.
  paraphrase: 'Much of the thughūr coastline was wetland by the Early Islamic period:
    the Cilician Plain was dominated by marsh near the Sayhān and Jayhān outlets;
    the area south of Tarsus along the Nahr al-Baradān, and the Plain of Issus around
    Alexandretta (with Hisn al-Tīnāt and Kinet Höyük), were marshland, with salina
    basins dug for salt. Inland, the Quwayq traverses the Marj al-Aḥmar before emptying
    into the Buḥayra al-Matkh marshes; Raqqa/Rāfiqa (Raqqa al-Sawdāʾ) was ringed by
    marsh — the word raqqa itself denoting seasonal river-marsh — and marsh is to
    be assumed around al-Raḥba where the Khabūr meets the Euphrates.'
  location_within_source: pp. 222-223.
  confidence: 3
  notes: Minor hydronyms (Marj al-Aḥmar, Buḥayra al-Matkh) and the comparative al-Andalus/Sicily
    marsh material (al-ʿUdhrī on the Segura; Tiberias reed-mat) deferred. Source-of-source
    travel accounts not minted as sources.
