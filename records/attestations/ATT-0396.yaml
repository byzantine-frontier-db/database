  citation: Eger 2008, Appendix 2, s.v. Jawzāt (or Ḥiṣn al-Jawzāt), p. 478 (SRC-0065).
  paraphrase: Eger relays that Jawzāt was a fortress staffed by a qāḍī (Abū ʿAmr al-Ṭarsūsī),
    an amir and deputy amir, a preacher, a keeper of the fort and a keeper of the bathhouse,
    a clerk, two couriers, a trumpet-player and troops, with no women or unbearded boys permitted;
    he stresses the passage's value as a rare snapshot of a typical frontier garrison and
    as evidence that even a small frontier site had a bathhouse.
  confidence: 3
