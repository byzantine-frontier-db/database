  paraphrase: Preliminary surface collection showed an overwhelming preponderance of
    ʿAbbāsid ceramics (many brittleware holemouth rims) with almost no seventh-century
    brittleware diagnostics and very few Syrian yellow-glaze wares, consistent with
    resettlement of the site only from the mid-eighth century; Roman through Middle
    Islamic surface material was largely confined within the city walls rather than
    the extramural areas.
