  citation: al-Balādhurī, Futūḥ al-buldān (SRC-0016); reached via Eger 2008, Appendix 2, s.v.
    Sumaysāṭ, pp. 525–535 (SRC-0065).
  paraphrase: al-Balādhurī records that, under ʿUmar I, ʿIyāḍ b. al-Ghanm sent Ṣafwān b. al-Muʿaṭṭal
    and Ḥabīb b. Maslama al-Fihrī against Sumaysāṭ; after the surrounding villages and forts
    were destroyed the townspeople surrendered on terms like those of Ruhā — one dīnār and two
    modii of wheat per man — and, having rebelled once the army moved on to Sarūj, were subdued
    again by ʿIyāḍ.
