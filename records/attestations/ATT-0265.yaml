    p. 235, fn 107 (cf. Abu Ezzah; Kennedy, Armies of the Caliphs).
  paraphrase: Balādhurī records that Muʿāwiya transported Persians to Anṭākiya from
    Baʿalabakk, Ḥimṣ, Baṣra and Kūfa in 669/70, adding to a Persian community present
    since the first (540) and second (613) Persian conquests.
