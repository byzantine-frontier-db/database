  paraphrase: Markets and merchants are attested in at least seven frontier towns
    (Adhana, Anṭākiya, al-Massīsa, Hadath, Hisn Kamkh, Kanīsa al-Sawdāʾ and Sumaysāṭ)
    and at the inn at Baghrās, with Byzantium the other great market; the thughūr
    economy was self-sufficient at the micro-level, and monasteries and awqāf of the
    ʿawāṣim around Anṭākiya and Ḥalab supported military and religious institutions.
