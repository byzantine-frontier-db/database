  citation: Ibn Buṭlān, quoted in Yāqūt, Muʿjam al-buldān (1955-7), 1.267; trans.
    Le Strange, Palestine Under the Moslems, p. 370 (via Eger 2015, SRC-0007, p. 267
    n. 3)
  direct_quotation: the villages ran continuous, their gardens full of flowers
  paraphrase: 'Travelling through the Amuq Plain in 1051, the Christian physician
    Ibn Buṭlān found the whole country between Ḥalab and Anṭākiya populous and prosperous:
    the soil sown with wheat and barley growing under the olive trees, continuous
    villages, gardens full of flowers, and waters flowing on every hand.'
