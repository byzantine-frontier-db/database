  provenance: modern_synthesis
  citation: Eger 2008, Appendix 2, s.v. Dulūk, pp. 455–457 (SRC-0065).
  paraphrase: Eger reports that in 746 Constantine V (Copronymos) took the region
    of Dulūk from the Muslims; that around 753 ʿAbdalla b. ʿAlī, directed by Abū al-ʿAbbās,
    led a summer raid of Syro-Jazīrans, Khurāsānīs and men of Mawṣil as far as Dulūk
    without crossing the Taurus; and that Dulūk kept a Syriac-Christian bishopric
    ('Dulūk and Mabbug/Manbij'), the town lasting to the mid-eleventh century and
    the village into the thirteenth.
  confidence: 3
  notes: Section-2 synthesis of the entry's frontier-military and ecclesiastical narrative,
    with no single identifiable primary footnote; attested as modern_synthesis against
    SRC-0065. The conquest of Dulūk by Abū ʿUbayda is already carried by ATT-0126
    (al-Balādhurī) and ATT-0133 (SRC-0007) and is not repeated. Ibn Rusta's notice
    of Dulūk as a thughūr site in 903 is named in the entry but not separately attested
    this session (no Ibn Rusta SourceRecord yet; deferred).
