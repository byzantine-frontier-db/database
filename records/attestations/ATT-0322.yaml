  citation: al-Balādhurī, Futūḥ al-buldān (1957-8), p. 230; reached via Eger 2015,
    p. 302.
  paraphrase: al-Balādhurī reports that the Zuṭṭ, Sayābija and Andaghar were Indians
    (Sindī) in the Persian army; the second group of Zuṭṭ was brought in the Umayyad
    period by Muḥammad b. al-Qāsim al-Thaqafī, prefect of al-Ḥajjāj, after his Indus
    Valley campaigns, and settled in the district of Kaskar east of al-Kūfa, in the
    Tigris lowlands around Wāsiṭ, with their families and livestock; following the
    conquests the Zuṭṭ had converted, become mawālī and based themselves around Baṣra.
