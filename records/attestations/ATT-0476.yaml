  citation: Eger 2008, Appendix 2, s.v. Sumaysāṭ, pp. 525–535 (SRC-0065), reporting published
    excavation and survey.
  paraphrase: From 1978 the University of Ankara renewed excavation under the dam threat; in
    1983 N. Özgüç's team dug below the medieval, Roman and Hellenistic levels to the Parthian
    (Commagenian) palace, encountering a Late Roman basilica over the central court and an eastern
    bathhouse with a caldarium. Parts of the Late Hellenistic/Roman city wall (opus reticulatum,
    robbed out) survived on the south-east with a Ruhā gate facing the Euphrates crossing; Sinclair
    records c. 5.5 km of Roman wall reused by an Islamic-period rebuild (tenth-century Ḥamdānid
    or twelfth-century Artūqid, an inscribed tower favouring the latter), a north cemetery of
    rock-cut tombs toward Kilisyan, and a west-bank aqueduct that Ainsworth traced some ten
    miles to the Kahta Su.
  confidence: 3
  notes: Section-3 published archaeology (Özgüç 1978–83 Ankara excavations; Sinclair; Ainsworth).
