  citation: 'Eger 2015, pp. 242-243 (citing fn 134: Straughn).'
  paraphrase: Highland Muslim communities are barely evidenced - the exceptions being
    Bara and Dayr Simʿan with newly-built mosques and Dayr Seta with a repurposed
    mosque; lesser towns like ʿImm, villages like Domuztepe and monastery-towns like
    ʿAzāz retained Christian communities, while Syriac- and Aramaic-speaking Christians
    (called Nabaṭ) and a residual urban Greek (Melkite) population remained, and nearly
    every major thaghr kept a bishop's seat.
