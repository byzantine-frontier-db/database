  citation: Eger 2008, Appendix 2, s.v. Malaṭiya, pp. 487–492, "Remains" (SRC-0065).
  paraphrase: 'Eger relays the survey record (chiefly Sinclair): a moated, double-fortified rectangular
    circuit with polygonal and rectangular towers, its south side holding the entrance; Sinclair
    took the present walls to be the sixth-century (outer) wall and credited the rectangular
    layout to the Romans, reading the "prow"-shaped western/southern towers and large eastern
    bastions as eighth/ninth-century and small-block work as twelfth-century. The circuit measures
    c. 500 m (SW–NW) by c. 300 m (SW–SE); the Saljūq Great Mosque (1224) lies slightly southwest
    of centre; Italian teams have worked since the 1960s, mainly at Arslantepe to the south.'
  confidence: 3
  notes: Section-3 published-archaeology summary (Sinclair; Italian missions), as relayed by Eger.
