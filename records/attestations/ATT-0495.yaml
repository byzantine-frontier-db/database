  citation: al-Ṭarsūsī (Abū ʿAmr ʿUthmān b. ʿAbd Allāh), Kitāb siyār al-thughūr (SRC-0077),
    transmitted by Ibn al-ʿAdīm, Bughyat al-ṭalab (SRC-0057); reached via Eger 2008, Appendix 2,
    s.v. Ṭarsūs, pp. 538–550 (SRC-0065).
  paraphrase: 'The tenth-century account of al-Ṭarsūsī''s Kitāb siyār al-thughūr, preserved in Ibn
    al-ʿAdīm''s history of Aleppo, describes the internal organisation of Ṭarsūs: the town apportioned
    into some 20,000 plots; wall-towers held in private ownership and used as dwellings for settled
    warriors (mutaʾahhilīn) and bachelor volunteers (ʿuzzāb), one serving as a paper factory; ghāzī
    housing of various kinds (dār, ribāṭ, zāwiya, khānqāh); the muḥtasib charged with recruiting
    fighters; and, when the muster (nafīr) went out, all the city gates locked and their keys entrusted
    to the chief of police until the troops returned.'
  confidence: 3
  notes: 'Section-2 primary attestation. al-Ṭarsūsī''s Kitāb siyār al-thughūr now has its own
    SourceRecord (SRC-0077), transmitted via Ibn al-ʿAdīm (SRC-0057) — the extant witness (Rule 4).
    Ibn ʿAtiyya''s 903 count (34,000 dwellings in 2,000 streets), also transmitted here, is a
    substantive co-datum currently unattested — FLAG for a decision on whether to attest it against
    SRC-0057 (rule 12) or mint Ibn ʿAtiyya. [citation needed: exact edition/page].'
