  citation: 'Eger 2015, pp. 235-237 (citing fns 109-111: von Sivers; Kennedy; Eger
    gazetteer).'
  paraphrase: 'Caliphal frontier renovations concentrated in the later eighth century:
    under al-Manṣūr a programme rebuilt four towns 756-760 under Ṣāliḥ b. ʿAlī, whose
    family had inherited most of the northern-Syrian and Mesopotamian Umayyad lands;
    al-Mahdī (via Hārūn and the Khurāsānī commander al-Ḥasan b. Qaḥṭaba) repaired
    eight thughūr towns and Hārūn six more, focusing in 799-800 on ʿAyn Zarba, Kanīsa
    al-Sawdāʾ and Hārūnīyya in the eastern Cilician Plain; both caliphs settled Khurāsānīs,
    Yamanīs, Jazīrans from Mawṣil, Syrians and volunteers.'
