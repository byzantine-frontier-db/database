  citation: Ibn Ḥawqal, Kitāb Ṣūrat al-Arḍ (SRC-0009); reached via Eger 2008, Appendix 2, s.v. Ṭarsūs,
    pp. 538–550 (SRC-0065).
  paraphrase: 'Ibn Ḥawqal, writing in the tenth century, contrasts Early Islamic Ṭarsūs with the
    Byzantine-occupied city of his own day: he describes a garrison of volunteer cavalry drawn from
    across the Muslim world, supported by property placed in waqf, with regions from Persia to the
    Maghrib each maintaining a hostelry (dār) and a ribāṭ in the city to house their ghāzīs; he also
    records that al-Maʾmūn, who died at Badhandūn (Podandos) at the Cilician Gates in 833, was buried
    at Ṭarsūs beside the Friday mosque.'
