  direct_quotation: Malaṭyah being one of the Mesopotamian frontier towns
  paraphrase: al-Balādhurī reports that al-Manṣūr settled 4,000 fighters from Mesopotamia
    (ahl al-Jazīra) at Malaṭya, one of the Mesopotamian frontier towns, and that the
    division of the thughūr into the Syrian (al-shāmiya) and Jaziran (al-jazariya)
    sectors was made to distinguish the regional and tribal makeup of the armies crossing
    the frontier.
  confidence: 4
  notes: Reached via Eger 2015, p. 284 (fn 14). Re-attests existing event ENT-EVT-0035
    (al-Manṣūr's settlement of 4,000 soldiers at Malaṭya) and links the thughūr-division
    divisions ENT-PLC-0018/0019. Complements ATT-0152 (al-Balādhurī's paraphrase placing
    Malatiya among the Jaziran-settled frontier towns). Both share the source and
    event; retained as distinct because ATT-0152 is the general paraphrase while this
    is the specific quotation (4,000 fighters).
