  citation: al-Balādhurī, Futūḥ al-buldān (SRC-0016); reached via Eger 2008, Appendix 2, s.v.
    Iskandarūna, p. 476 (SRC-0065).
  paraphrase: al-Balādhurī records that Iskandarūna belonged to Maslama b. ʿAbd al-Malik;
    that a fort there was built by Umm Jaʿfar Zubayda, wife of al-Rashīd; and that the site
    passed as iqṭāʿ to Raghā, a mawlā of al-Mahdī, then through al-Mahdī's sons to Ibrāhīm
    b. Saʿīd al-Jawharī and to the grand qāḍī Aḥmad b. Abī Duʾād al-Iyādī, who renovated it
    under al-Wāthiq, before it reverted to the caliph al-Mutawakkil and was taken by Ibn Ṭūlūn
    in 877.
  confidence: 3
