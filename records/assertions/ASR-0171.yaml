- record_type: assertion
  id: ASR-0171
  proposition: Water-lifting wheels (naʿūra, sāqiya) were used on the deeply incised
    northern Euphrates; qadus jars at Dibsi Faraj attest such installations; villages
    named Nāʿūra (between Halab and Bālis near Jabbūl Lake) and al-Dāliya (near al-Raḥba
    on the Nahr Saʿīd) preserve the toponymy, and Hārūn al-Rashīd observed naʿūra
    wheels at al-Raḥba.
